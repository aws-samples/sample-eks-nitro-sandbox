site_name: AWS Nitro Sandbox on Amazon EKS Blueprints
site_description: Runnable blueprints for AWS Nitro Sandbox on Amazon EKS
repo_url: https://github.com/aws-samples/sample-eks-nitro-sandbox
repo_name: aws-samples/sample-eks-nitro-sandbox
# docs_dir is examples/, so the "edit this page" pencil points there.
edit_uri: edit/main/examples/

# No site_url on purpose: it makes mkdocs-material emit absolute canonical/og URLs.

# The examples/ folder IS the docs tree: every README.md is a page, and a path on the
# site is the path in the repo.
docs_dir: examples
site_dir: site

# Plain static output: emit foo.html rather than foo/index.html so no directory-index
# resolution is needed.
use_directory_urls: false

extra_css:
  - assets/extra.css     # Amazon brand orange on top of Material's orange palette

extra:
  # Google Analytics 4, Material's built-in integration. It also runs under
  # `mkdocs serve`; filter reports on Hostname = aws-samples.github.io.
  analytics:
    provider: google
    property: G-YCK065JLFD

theme:
  name: material
  icon:
    logo: material/cube-outline
    repo: fontawesome/brands/github
  features:
    # Left vertical menu only, with navigation.sections on: each top-level nav entry
    # (Getting started, Managed agents) renders as a section heading with its pages always
    # listed under it, instead of a collapsible twisty. navigation.tabs stays off so
    # the sections are not moved into a top bar. navigation.indexes is off on purpose:
    # it folds a section's first page into the heading and drops it from the menu.
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    # Amazon orange. Material's built-in "orange" is #ff9800 and, being a light colour,
    # it automatically switches the header text to dark for contrast. assets/extra.css
    # pins the exact brand hex.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # ```mermaid blocks -> client-side diagrams. GitHub renders the same fences
        # natively, so diagrams work both on the site and when browsing the repo.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# The menu mirrors examples/'s own directory layout: a path on the site is the path in
# the repo. Each section is a heading with its samples listed under it.
nav:
  - Home: README.md
  - Getting started:
      - Hello sandbox: getting-started/hello-sandbox/README.md
      - Coding agent: getting-started/coding-agent/README.md
      - Warm pool: getting-started/warm-pool/README.md
  - Setup:
      - Ubuntu AMI: setup/ubuntu-ami/README.md
      - Cilium on Ubuntu nodes: setup/cilium-ubuntu/README.md
  - Isolation:
      - Network policy: isolation/network-policy/README.md
      - Sandbox limits: isolation/sandbox-limits/README.md
  - Policy:
      - Cedar policy: policy/cedar-policy/README.md
  - AI agents:
      - Coding agents for developers: ai-agents/coding-agents-for-developers/README.md
  - Managed agents:
      - Claude Managed Agents: managed-agents/claude-managed-agents/README.md
      - OpenAI Managed Agents: managed-agents/openai-managed-agents/README.md
  - Subagent security:
      - Subagent security: subagent-security/README.md
      - Subagent security nono: subagent-security/nono/README.md
      - Subagent security bubblewrap: subagent-security/bubblewrap/README.md
      - Subagent security OpenShell: subagent-security/openshell/README.md
  - OpenShell:
      - OpenShell on Amazon EKS: openshell/kubernetes/README.md
  - Agent sandbox:
      - Pause and resume: agent-sandbox/pause-resume/README.md
      - Warm pool with KEDA: agent-sandbox/warm-pool-autoscaling-keda/README.md
      - IDE in the browser: agent-sandbox/ide/README.md
      - SandboxTemplate Argo Rollouts: agent-sandbox/argo-rollouts/README.md
      - Brain and hands: agent-sandbox/brain-and-hands/README.md
  - Storage:
      - EBS volumes: storage/ebs/README.md
      - Shared EFS storage: storage/efs/README.md
      - Shared S3 Files storage: storage/s3-files/README.md
  - CI/CD:
      - Docker builds: ci-cd/docker-builds/README.md
      - GitHub Actions runners: ci-cd/github-actions/README.md
      - GitLab CI jobs: ci-cd/gitlab-ci/README.md
  - Integrations:
      - Temporal workflows: integrations/temporal/README.md
  - Confidential:
      - Confidential sandboxes: confidential/README.md
      - Encrypted image: confidential/encrypted-image/README.md
      - Secrets Manager secret: confidential/secrets-manager-secret/README.md  # pragma: allowlist secret
      - S3 encrypted file: confidential/s3-encrypted-file/README.md
      # Last on purpose: a reference the three samples above point at, rather than one
      # of them.
      - Image trust by signer: confidential/signer-policy/README.md
