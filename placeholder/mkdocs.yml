# Placeholder site for GitHub Pages, published until the samples site goes live.
# It is built by .github/workflows/pages.yml. The real site is ../mkdocs.yml; switch
# the workflow to it (and delete this folder) on launch day.
site_name: Coming soon
docs_dir: docs
site_dir: ../site
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.instant
  palette:
    primary: orange

# Nothing to navigate yet: one page, no search.
plugins: []
