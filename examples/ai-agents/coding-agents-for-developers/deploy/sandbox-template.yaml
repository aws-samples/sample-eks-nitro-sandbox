# One SandboxTemplate + SandboxWarmPool per CLI. setup.sh renders this once for each
# CLI in the agent list, substituting <CLI> (claude-code, codex, kiro-cli, opencode,
# pi, oh-my-pi), <ACCOUNT_ID>, <AWS_REGION> and <POOL_REPLICAS>.
#
# The pods boot warm with NO workspace: a SandboxClaim that adds a volume forces a cold
# start, so the session folder is mounted inside the guest after the claim instead (see
# the app and the base image's session-entrypoint.sh). The template ships its own egress
# policy, so it sets networkPolicyManagement: Unmanaged.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agent-<CLI>
  labels:
    app.kubernetes.io/part-of: coding-agents-for-developers
spec:
  networkPolicyManagement: Unmanaged   # egress-policy.yaml is the policy for these pods
  podTemplate:
    metadata:
      labels:
        app: agent-session
        agent-cli: <CLI>
        app.kubernetes.io/part-of: coding-agents-for-developers
      # Nitro sandbox throttle annotations. Absent, they default to 100 Mbit/s ingress and
      # egress (capped by a 1500 packets/second bucket), a 400 Mbit/s overlay (scratch) disk
      # and 1500 overlay IOPS -- tight for an interactive coding agent that pulls model
      # responses, clones repos and installs packages, which showed up as a slow launch.
      # Turn the network and ephemeral-disk limits off for a responsive session. The value
      # must be the string "disabled": `0` is rejected and leaves the pod stuck creating.
      # Bandwidth and packet rate are independent token buckets, so BOTH must be disabled to
      # actually uncap the network. rootfs-disk-* is already unlimited by default, and
      # conntrack-limit cannot be turned off, so neither is set here.
      annotations:
        sandbox.amazonaws.com/ingress-bandwidth: "disabled"
        sandbox.amazonaws.com/ingress-packets-per-second: "disabled"
        sandbox.amazonaws.com/egress-bandwidth: "disabled"
        sandbox.amazonaws.com/egress-packets-per-second: "disabled"
        sandbox.amazonaws.com/overlay-disk-bandwidth: "disabled"
        sandbox.amazonaws.com/overlay-disk-iops: "disabled"
    spec:
      runtimeClassName: isolated-sandbox
      # The pod holds no AWS identity of its own: the mount credential arrives per
      # session through exec, and the model credential (for the Bedrock CLIs) comes
      # from the serviceAccount's Pod Identity role, which may only invoke models.
      serviceAccountName: agent-session
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: agent
          image: <ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/coding-agents-for-developers-<CLI>:latest
          # Optional admin-supplied sign-in token. Kiro CLI uses the developer's own Kiro
          # sign-in; an admin who wants the pod pre-authenticated (so the developer is not
          # asked to sign in) creates a Secret named agent-<CLI>-auth with a `token` key
          # holding the base64 auth bundle, and the kiro-cli image's cli-setup.sh writes it
          # into Kiro CLI's store. optional: true means the pod still starts when the Secret
          # is absent -- then Kiro CLI runs its normal device-flow login. Other CLIs do not
          # read KIRO_CLI_AUTH_B64, so this env is harmless for them.
          env:
            - name: KIRO_CLI_AUTH_B64
              valueFrom:
                secretKeyRef:
                  name: agent-<CLI>-auth
                  key: token
                  optional: true
          # The mount inside the guest needs root + SYS_ADMIN; the CLI then runs as the
          # unprivileged dev user. runAsNonRoot is intentionally not set: the entrypoint
          # mounts as root, then setpriv drops to uid 1000 for the CLI. SETUID/SETGID are
          # exactly what setpriv needs to make that drop; without them the CLI would have
          # to run as root. All other capabilities stay dropped.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN", "SETUID", "SETGID"]
          # 2 vCPU / 4Gi per session pod. Measured headroom: even Codex -- the heaviest CLI,
          # with a TUI, an app-server daemon and a worker -- peaks under ~0.1 vCPU and ~0.9Gi
          # on a model turn (`kubectl top pod`), so every CLI sits well inside this. (Codex's
          # slow startup and input lag are not resource starvation; they are its app-server
          # cold start and per-keystroke round-trip, not CPU.)
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:   { cpu: "2", memory: 4Gi }
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: agent-<CLI>
  labels:
    app.kubernetes.io/part-of: coding-agents-for-developers
spec:
  replicas: <POOL_REPLICAS>
  sandboxTemplateRef:
    name: agent-<CLI>
