apiVersion: v1
kind: Pod
metadata:
  name: gateway-a1b2c3d4e5f6-abc123def-test1
  generateName: gateway-a1b2c3d4e5f6-abc123def-
  namespace: oce-tenant-contract
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise
    app.kubernetes.io/name: gateway-a1b2c3d4e5f6
    openclaw.dev/agent: agt_11111111-1111-1111-1111-111111111111
    openclaw.dev/namespace: ns_22222222-2222-2222-2222-222222222222
    openclaw.dev/revision: rev_33333333-3333-3333-3333-333333333333
    openclaw.dev/service-principal: service-agent-agt_11111111-1111-1111-1111-111111111111
    openclaw.dev/workload-role: gateway
  ownerReferences:
    - apiVersion: apps/v1
      controller: true
      kind: ReplicaSet
      name: gateway-a1b2c3d4e5f6-abc123def
      uid: 11111111-2222-3333-4444-555555555555
spec:
  serviceAccountName: agent-a1b2c3d4e5f6
  initContainers:
    - name: prepare-private-state
      image: example.invalid/oce-runtime:test
      imagePullPolicy: IfNotPresent
      command:
        - /usr/bin/tini
        - -s
        - --
        - node
        - -e
      args:
        - |
          const { chmodSync, mkdirSync } = require("node:fs");
          for (const path of ["/runtime-state/home","/runtime-temporary/tmp","/runtime-state/home/gateway-codex-home","/gateway-state/sessions","/runtime-state/home/.openclaw","/gateway-state/agents"]) {
            mkdirSync(path, { recursive: true });
            chmodSync(path, 0o700);
          }
          mkdirSync("/runtime-temporary/tmp", { recursive: true, mode: 0o700 });
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: runtime-state
          mountPath: /runtime-state
          mountPropagation: HostToContainer
        - name: openclaw-gateway-state
          mountPath: /gateway-state
        - name: runtime-temporary
          mountPath: /runtime-temporary
    - name: prepare-embedded-gateway-owner
      image: example.invalid/oce-runtime:test
      command:
        - node
        - -e
      args:
        - |
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const verifier = "/run/oce-gateway-owner-key/public.pem";
          if (!fs.existsSync(verifier)) {
            const keys = crypto.generateKeyPairSync("ed25519", {
              publicKeyEncoding: { type: "spki", format: "pem" },
              privateKeyEncoding: { type: "pkcs8", format: "pem" },
            });
            fs.writeFileSync(verifier, keys.publicKey, { flag: "wx", mode: 0o444 });
            fs.writeFileSync("/run/oce-gateway-owner-start/private.pem", keys.privateKey, { flag: "wx", mode: 0o400 });
          }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: gateway-owner-key
          mountPath: /run/oce-gateway-owner-key
        - name: gateway-owner-start
          mountPath: /run/oce-gateway-owner-start
  containers:
    - name: gateway
      image: example.invalid/oce-runtime:test
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: OPENCLAW_POD_UID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: OPENCLAW_GATEWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gateway-password-a1b2c3d4e5f6
              key: gateway-password
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: harness-secrets-a1b2c3d4e5f6-012345abcdef
              key: OPENAI_API_KEY
        - name: OPENCLAW_HARNESS_CREDENTIAL_ENV
          value: OPENAI_API_KEY
      volumeMounts:
        - name: runtime-state
          mountPath: /home/node
          subPath: home
          mountPropagation: HostToContainer
        - name: workspace
          mountPath: /workspace
          subPathExpr: $(TENANT)/workspace
          readOnly: true
          recursiveReadOnly: Enabled
        - name: runtime-temporary
          mountPath: /tmp
          subPath: tmp
        - name: openclaw-gateway-state
          mountPath: /home/node/.openclaw/agents
          subPath: agents
        - name: openclaw-gateway-state
          mountPath: /home/node/.openclaw/sessions
          subPath: sessions
        - name: openclaw-configuration
          mountPath: /etc/openclaw
          readOnly: true
  volumes:
    - name: runtime-state
      emptyDir: {}
    - name: runtime-temporary
      emptyDir: {}
    - name: workspace
      emptyDir: {}
    - name: openclaw-gateway-state
      persistentVolumeClaim:
        claimName: gateway-state-a1b2c3d4e5f6
    - name: gateway-owner-key
      emptyDir: {}
    - name: gateway-owner-start
      emptyDir: {}
    - name: openclaw-service-principal
      projected:
        sources:
          - serviceAccountToken:
              audience: openclaw-enterprise
              expirationSeconds: 900
              path: token
    - name: openclaw-configuration
      configMap:
        name: gateway-a1b2c3d4e5f6-rev-012345abcdef
        items:
          - key: openclaw.json
            path: openclaw.json
