# Puts OCE's Agent workload pods in a Nitro sandbox and adapts their gateway-state
# volume to it, in OCE tenant namespaces only. OCE itself is unmodified.
#
# 1. Sets runtimeClassName: isolated-sandbox. The RuntimeClass admission that runs after
#    this policy still adds the RuntimeClass's node selector and pod overhead.
# 2. A sandbox guest cannot mount a PVC subPath (StartError "resolve_block_device ...
#    nothing is mounted there"), and refuses one PVC at different paths across
#    containers. OCE mounts its gateway-state PVC at /gateway-state in the
#    prepare-private-state init container and at seven subPaths under
#    /home/node/.openclaw in later containers. This policy drops those subPath mounts,
#    mounts the PVC at /gateway-state in every container that had one, and inserts an
#    init container right after prepare-private-state that replaces each former mount
#    point with a symlink to /gateway-state/<subPath>. /home/node is an emptyDir subPath,
#    which a guest does mount, so the links live in the Pod's own home.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: openclaw-enterprise-nitro-adapter
  labels: { sample.eks-nitro-sandbox/managed-by: openclaw-enterprise }
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - { apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"] }
    namespaceSelector:
      matchLabels: { app.kubernetes.io/managed-by: openclaw-enterprise }
  matchConditions:
    - name: oce-workload
      expression: >-
        object.metadata.?labels[?'openclaw.dev/workload-role'].orValue('') in ['gateway', 'agent']
  variables:
    - name: gw
      expression: "'openclaw-gateway-state'"
    - name: inits
      expression: object.spec.?initContainers.orValue([])
    - name: initFix
      expression: >-
        [0, 1, 2, 3, 4, 5, 6, 7].filter(i, size(variables.inits) > i
          && variables.inits[i].?volumeMounts.orValue([]).exists(v, v.name == variables.gw && v.?subPath.orValue('') != ''))
    - name: mainFix
      expression: >-
        [0, 1, 2, 3].filter(i, size(object.spec.containers) > i
          && object.spec.containers[i].?volumeMounts.orValue([]).exists(v, v.name == variables.gw && v.?subPath.orValue('') != ''))
    - name: prep
      expression: >-
        [0, 1, 2, 3, 4, 5, 6, 7].filter(i, size(variables.inits) > i && variables.inits[i].name == 'prepare-private-state')
    - name: links
      expression: >-
        object.spec.containers.map(c, c.?volumeMounts.orValue([])).flatten().filter(v,
          v.name == variables.gw && v.?subPath.orValue('') != '' && v.mountPath.startsWith('/home/node/'))
          .map(v, v.mountPath.substring(11) + '=' + v.subPath)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: 'add', path: '/spec/runtimeClassName', value: 'isolated-sandbox'}]
          + variables.initFix.map(i, JSONPatch{op: 'replace',
              path: '/spec/initContainers/' + string(i) + '/volumeMounts',
              value: variables.inits[i].volumeMounts
                .filter(v, !(v.name == variables.gw && v.?subPath.orValue('') != ''))
                .map(v, Object.spec.initContainers.volumeMounts{name: v.name, mountPath: v.mountPath,
                        ?subPath: v.?subPath, ?readOnly: v.?readOnly})
                + (variables.inits[i].volumeMounts.exists(v, v.name == variables.gw && v.mountPath == '/gateway-state')
                    ? [] : [Object.spec.initContainers.volumeMounts{name: variables.gw, mountPath: '/gateway-state'}])})
          + variables.mainFix.map(i, JSONPatch{op: 'replace',
              path: '/spec/containers/' + string(i) + '/volumeMounts',
              value: object.spec.containers[i].volumeMounts
                .filter(v, !(v.name == variables.gw && v.?subPath.orValue('') != ''))
                .map(v, Object.spec.containers.volumeMounts{name: v.name, mountPath: v.mountPath,
                        ?subPath: v.?subPath, ?readOnly: v.?readOnly})
                + [Object.spec.containers.volumeMounts{name: variables.gw, mountPath: '/gateway-state'}]})
          + (size(variables.links) > 0 && size(variables.prep) == 1
              ? [JSONPatch{op: 'add', path: '/spec/initContainers/' + string(variables.prep[0] + 1),
                  value: Object.spec.initContainers{
                    name: 'nitro-link-gateway-state',
                    image: object.spec.containers[0].image,
                    imagePullPolicy: 'IfNotPresent',
                    command: ['node', '-e'],
                    args: ["const fs=require('node:fs');for(const pair of process.env.OCE_STATE_LINKS.split(',')){const [rel,sub]=pair.split('=');const link='/runtime-state/home/'+rel;const target='/gateway-state/'+sub;let st;try{st=fs.lstatSync(link)}catch{}if(st===undefined){fs.symlinkSync(target,link)}else if(!st.isSymbolicLink()||fs.readlinkSync(link)!==target){throw new Error('refusing to replace '+link)}console.log('linked',rel,'->',target)}"],
                    env: [Object.spec.initContainers.env{name: 'OCE_STATE_LINKS', value: variables.links.join(',')}],
                    securityContext: Object.spec.initContainers.securityContext{
                      allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
                      capabilities: Object.spec.initContainers.securityContext.capabilities{drop: ['ALL']}},
                    volumeMounts: [Object.spec.initContainers.volumeMounts{name: 'runtime-state', mountPath: '/runtime-state'}]}}]
              : [])
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: openclaw-enterprise-nitro-adapter
  labels: { sample.eks-nitro-sandbox/managed-by: openclaw-enterprise }
spec:
  policyName: openclaw-enterprise-nitro-adapter
