apiVersion: v1
kind: Namespace
metadata:
  name: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
automountServiceAccountToken: false
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openclaw-enterprise-nitro-adapter-selfsigned
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openclaw-enterprise-nitro-adapter-serving
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
spec:
  secretName: openclaw-enterprise-nitro-adapter-tls
  dnsNames:
    - openclaw-enterprise-nitro-adapter.openclaw-enterprise-adapter.svc
    - openclaw-enterprise-nitro-adapter.openclaw-enterprise-adapter.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: openclaw-enterprise-nitro-adapter-selfsigned
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
        app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
    spec:
      serviceAccountName: openclaw-enterprise-nitro-adapter
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          # This intentionally invalid value makes the source manifest
          # non-deployable. Use render-adapter-manifest.sh to inject an exact
          # adapter digest and the ownership-helper digest.
          image: ""
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: PORT
              value: "8443"
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
            - name: OCE_ALLOWED_ADMISSION_USERS
              value: system:serviceaccount:kube-system:replicaset-controller,system:kube-controller-manager
            - name: OCE_ALLOWED_DEPLOYMENT_USERS
              value: system:serviceaccount:openclaw-system:openclaw-enterprise-worker
            - name: OCE_ALLOWED_REPLICASET_USERS
              value: system:serviceaccount:kube-system:deployment-controller,system:kube-controller-manager
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: openclaw-enterprise-nitro-adapter-tls
            defaultMode: 288
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The Kubernetes API server must reach the admission webhook. NetworkPolicy
    # cannot identify it portably, so permit only the webhook TLS port.
    - ports:
        - protocol: TCP
          port: 8443
  egress: []
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: protect-openclaw-enterprise-namespace-label
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - namespaces
          - namespaces/status
          - namespaces/finalize
        scope: Cluster
  validations:
    - expression: >-
        !has(oldObject.metadata.labels) ||
        !('app.kubernetes.io/managed-by' in oldObject.metadata.labels) ||
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] != 'openclaw-enterprise' ||
        (has(object.metadata.labels) &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'openclaw-enterprise')
      message: The app.kubernetes.io/managed-by=openclaw-enterprise namespace label is immutable.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: protect-openclaw-enterprise-namespace-label
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
spec:
  policyName: protect-openclaw-enterprise-namespace-label
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: openclaw-enterprise-nitro-adapter
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
  annotations:
    cert-manager.io/inject-ca-from: openclaw-enterprise-adapter/openclaw-enterprise-nitro-adapter-serving
webhooks:
  - name: nitro-adapter.openclaw-enterprise.sandbox.eks.amazonaws.com
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    # The adapter rewrites the complete OCE gateway Pod contract in one pass.
    # The validating webhook checks the final object after all mutators run.
    reinvocationPolicy: Never
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: openclaw-enterprise-adapter
        name: openclaw-enterprise-nitro-adapter
        path: /mutate
        port: 443
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: openclaw-enterprise
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: openclaw-enterprise-nitro-policy
  labels:
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
  annotations:
    cert-manager.io/inject-ca-from: openclaw-enterprise-adapter/openclaw-enterprise-nitro-adapter-serving
webhooks:
  - name: validate-controller-chain.openclaw-enterprise.sandbox.eks.amazonaws.com
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: openclaw-enterprise-adapter
        name: openclaw-enterprise-nitro-adapter
        path: /validate
        port: 443
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: openclaw-enterprise
    rules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - replicasets
        scope: Namespaced
  - name: deny-ephemeral-containers.openclaw-enterprise.sandbox.eks.amazonaws.com
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: openclaw-enterprise-adapter
        name: openclaw-enterprise-nitro-adapter
        path: /validate
        port: 443
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: openclaw-enterprise
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
        scope: Namespaced
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - pods/ephemeralcontainers
        scope: Namespaced
  - name: protect-revision-configmaps.openclaw-enterprise.sandbox.eks.amazonaws.com
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: openclaw-enterprise-adapter
        name: openclaw-enterprise-nitro-adapter
        path: /validate
        port: 443
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: openclaw-enterprise
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - configmaps
        scope: Namespaced
