# Disposable installation-validation fixture. This intentionally uses emptyDir
# and a conspicuous name. It is not a production database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oce-validation-only-postgres
  labels:
    app.kubernetes.io/name: oce-validation-only-postgres
    app.kubernetes.io/instance: validation-only
    app.kubernetes.io/component: validation-only-database
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
    app.kubernetes.io/part-of: openclaw-enterprise-blueprint
  annotations:
    openclaw.dev/validation-only: "true"
    openclaw.dev/data-durability: "none-emptydir"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oce-validation-only-postgres
      app.kubernetes.io/instance: validation-only
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oce-validation-only-postgres
        app.kubernetes.io/instance: validation-only
        app.kubernetes.io/component: validation-only-database
        app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
        app.kubernetes.io/part-of: openclaw-enterprise-blueprint
      annotations:
        openclaw.dev/validation-only: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: __OCE_VALIDATION_POSTGRES_IMAGE__
          env:
            - name: POSTGRES_DB
              value: openclaw
            - name: POSTGRES_USER
              value: oce_validation
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oce-validation-only-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, oce_validation, -d, openclaw]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            exec:
              command: [pg_isready, -U, oce_validation, -d, openclaw]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oce-validation-only-postgres
  labels:
    app.kubernetes.io/name: oce-validation-only-postgres
    app.kubernetes.io/instance: validation-only
    app.kubernetes.io/component: validation-only-database
    app.kubernetes.io/managed-by: openclaw-enterprise-blueprint
    app.kubernetes.io/part-of: openclaw-enterprise-blueprint
  annotations:
    openclaw.dev/validation-only: "true"
spec:
  selector:
    app.kubernetes.io/name: oce-validation-only-postgres
    app.kubernetes.io/instance: validation-only
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
