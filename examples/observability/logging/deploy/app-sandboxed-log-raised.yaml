# app-sandboxed-log-raised: app-sandboxed with the sandbox's container-log rate
# raised from its 2M (2 Mbit/s) default to 20M with one annotation, so the same
# stdout burst arrives sooner. The annotation is read once, when the pod is created.
apiVersion: v1
kind: Pod
metadata:
  name: app-sandboxed-log-raised
  namespace: sandbox-logging
  labels:
    app: logging-app
  annotations:
    karpenter.sh/do-not-disrupt: "true"   # keep consolidation from evicting this bare pod mid-run
    sandbox.amazonaws.com/log-bandwidth: "20M"   # <-- the only change from app-sandboxed
spec:
  runtimeClassName: isolated-sandbox
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: public.ecr.aws/docker/library/python:3.12-slim
      imagePullPolicy: IfNotPresent
      command: ["python3", "-u", "/app/app.py"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
        - name: app-logs
          mountPath: /var/log/app
        - name: dev-log
          mountPath: /dev/log
  volumes:
    - name: app
      configMap:
        name: logging-app
    - name: app-logs
      emptyDir: {}
    # The node's syslog socket. Apps that log with syslog(3) are often given it
    # this way so their lines reach the node's journal.
    - name: dev-log
      hostPath:
        path: /dev/log
        type: Socket
