# app-sandboxed: the same pod as app-standard, differing only in the one line
#
#   runtimeClassName: isolated-sandbox
#
# Its containers run in a Nitro sandbox, a lightweight VM with its own kernel. So
# the emptyDir lives on the sandbox's own scratch disk, the segfault is printed by
# the guest kernel, and the /dev/log mount is a socket inside the VM: writes to it
# succeed and never reach the node's journal. stdout and stderr still reach the
# node: the runtime streams them out of the sandbox to the kubelet.
apiVersion: v1
kind: Pod
metadata:
  name: app-sandboxed
  namespace: sandbox-logging
  labels:
    app: logging-app
  annotations:
    karpenter.sh/do-not-disrupt: "true"   # keep consolidation from evicting this bare pod mid-run
spec:
  runtimeClassName: isolated-sandbox   # <-- the only field that differs from app-standard
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: public.ecr.aws/docker/library/python:3.12-slim
      imagePullPolicy: IfNotPresent
      command: ["python3", "-u", "/app/app.py"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
        - name: app-logs
          mountPath: /var/log/app
        - name: dev-log
          mountPath: /dev/log
  volumes:
    - name: app
      configMap:
        name: logging-app
    - name: app-logs
      emptyDir: {}
    # The node's syslog socket. Apps that log with syslog(3) are often given it
    # this way so their lines reach the node's journal.
    - name: dev-log
      hostPath:
        path: /dev/log
        type: Socket
