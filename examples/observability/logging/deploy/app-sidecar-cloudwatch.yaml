# app-sidecar-cloudwatch: app-sidecar-stdout with one change of output. Fluent Bit
# sends the records straight to CloudWatch Logs, to the log group in LOG_GROUP,
# with the credentials EKS Pod Identity gives the logging-sidecar ServiceAccount.
# That role may create the one log group and write to it, and nothing else.
apiVersion: v1
kind: Pod
metadata:
  name: app-sidecar-cloudwatch
  namespace: sandbox-logging
  labels:
    app: logging-app
  annotations:
    karpenter.sh/do-not-disrupt: "true"   # keep consolidation from evicting this bare pod mid-run
spec:
  runtimeClassName: isolated-sandbox
  serviceAccountName: logging-sidecar   # its Pod Identity role may write to one log group
  automountServiceAccountToken: false   # Pod Identity needs no Kubernetes API token
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: public.ecr.aws/docker/library/python:3.12-slim
      imagePullPolicy: IfNotPresent
      command: ["python3", "-u", "/app/app.py"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SYSLOG_SOCKET
          value: /run/syslog/log
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
        - name: app-logs
          mountPath: /var/log/app
        - name: syslog
          mountPath: /run/syslog
    - name: kernel-log
      image: public.ecr.aws/docker/library/python:3.12-slim
      imagePullPolicy: IfNotPresent
      command: ["python3", "-u", "/app/kernel-log.py"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["SYSLOG"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
        - name: kernel-logs
          mountPath: /var/log/kernel
    - name: fluent-bit
      image: public.ecr.aws/aws-observability/aws-for-fluent-bit:3.5.8
      imagePullPolicy: IfNotPresent
      command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/config/cloudwatch.conf"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AWS_REGION
          value: <AWS_REGION>
        - name: LOG_GROUP
          value: <LOG_GROUP>
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: fluent-bit-config
          mountPath: /fluent-bit/config
          readOnly: true
        - name: app-logs
          mountPath: /var/log/app
          readOnly: true
        - name: kernel-logs
          mountPath: /var/log/kernel
          readOnly: true
        - name: syslog
          mountPath: /run/syslog
  volumes:
    - name: app
      configMap:
        name: logging-app
    - name: fluent-bit-config
      configMap:
        name: logging-fluent-bit
    - name: app-logs
      emptyDir: {}
    - name: kernel-logs
      emptyDir: {}
    - name: syslog
      emptyDir: {}
