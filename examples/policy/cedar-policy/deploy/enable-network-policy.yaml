# EKS Auto Mode accepts network policies without enforcing them until this
# ConfigMap sets enable-network-policy-controller to "true". It affects the whole
# cluster; pods no policy selects are unaffected.
# https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
apiVersion: v1
kind: ConfigMap
metadata:
  name: amazon-vpc-cni
  namespace: kube-system
data:
  enable-network-policy-controller: "true"
