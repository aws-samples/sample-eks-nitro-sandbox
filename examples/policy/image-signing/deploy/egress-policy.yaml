# Egress for the two networked verifier pods: DNS, the Pod Identity credential
# endpoint, Amazon ECR and the S3 range ECR stores its layers and signatures in.
# Nothing else.
#
# An EKS Auto Mode ApplicationNetworkPolicy is a NetworkPolicy that also accepts
# hostnames (domainNames) in an egress rule. For the pods it selects, all ingress
# and all egress are denied except the rules below. scripts/setup.sh fills in the
# placeholders at apply time; the raw file keeps them so it reads cleanly.
#
# Placeholders the page fills in:
#   <COREDNS_IP>   your CoreDNS Service address:
#                    kubectl get svc -n kube-system kube-dns -o jsonpath='{.spec.clusterIP}'
#   <ACCOUNT_ID>   your AWS account ID (the ECR registry host is one per account,
#                    <ACCOUNT_ID>.dkr.ecr.<region>.amazonaws.com, not per repository):
#                    aws sts get-caller-identity --query Account --output text
#   <S3_CIDRS>     the Amazon S3 ranges for this Region, each as an "- ipBlock" line,
#                    from the AWS-managed prefix list com.amazonaws.<region>.s3:
#                    aws ec2 get-managed-prefix-list-entries ...
#
# Why ECR is two kinds of rule:
#   * The ECR API and registry endpoints resolve to a small, stable set of
#     addresses, so a domainNames rule holds them.
#   * The image layers and the Notation signature blob are served from Amazon S3
#     through a short-lived presigned URL whose host resolves across the whole S3
#     regional range. A domainNames rule cannot pin that, so S3 is allowed by its
#     published CIDRs instead. domainNames allows the addresses a name resolves to,
#     so names on the same addresses are reachable too; the S3 CIDRs are broader
#     still, allowing any S3 bucket in the Region. Narrow this with a gateway VPC
#     endpoint for S3 if your cluster has one.
#
# The Pod Identity credential endpoint (169.254.170.23) is allowed explicitly: the
# ECR credential helper reads the pod's role credentials from it to get an ECR auth
# token, and on this cluster the policy's default-deny applies to that link-local
# address too, so without the rule the token fetch hangs.
#
# The network-isolated pod (verify-signed-denied) is not selected here: it has no
# network to restrict, so it needs no policy.
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: image-signing-egress
  namespace: image-signing-sample
spec:
  podSelector:
    matchLabels:
      app: image-signing-verifier
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock: { cidr: <COREDNS_IP>/32 }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 }   # EKS Pod Identity credential endpoint
      ports:
        - { protocol: TCP, port: 80 }
    - to:
        - domainNames:
            - api.ecr.us-west-2.amazonaws.com              # ECR API: auth token, manifests, Referrers API
            - <ACCOUNT_ID>.dkr.ecr.us-west-2.amazonaws.com # the ECR registry endpoint (image and signature manifests)
      ports:
        - { protocol: TCP, port: 443 }
    - to:
<S3_CIDRS>
      ports:
        - { protocol: TCP, port: 443 }
