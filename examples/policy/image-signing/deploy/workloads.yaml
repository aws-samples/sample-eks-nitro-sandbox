# The three pods this sample compares. scripts/setup.sh renders POSITIVE_IMAGE_URI
# and NEGATIVE_IMAGE_URI to the pushed image refs (by digest) before applying; the
# raw file keeps the placeholders so it reads cleanly as source. The tokens are
# deliberately NOT substrings of one another, so the sed templating cannot rewrite
# one inside the other.
#
#   verify-signed         signed image, full network  -> in-guest verify PASSES
#   verify-unsigned       unsigned image, full network -> in-guest verify FAILS
#                         (no signature) - the negative case
#   verify-signed-denied  signed image, network-isolated -> in-guest verify FAILS
#                         with a registry-unreachable error, because notation must
#                         pull the signature from ECR and this guest has no network
#
# All three are the SAME image on runtimeClassName: isolated-sandbox. verify-signed
# and verify-signed-denied differ in exactly one line: the network-isolated
# annotation. verify-signed and verify-unsigned differ only in which ref they run
# (signed vs unsigned repository), so the checks are discriminating.
#
# The two networked pods carry the label app: image-signing-verifier, which the
# egress ApplicationNetworkPolicy selects. verify-signed-denied has no network to
# restrict, so it is left out of the selector.
#
# readOnlyRootFilesystem stays true; a small emptyDir at /scratch is the only
# writable path, used for HOME and TMPDIR so the ECR credential helper's token
# cache and notation's temp files have somewhere to go without a writable root.
---
apiVersion: v1
kind: Pod
metadata:
  name: verify-signed
  namespace: image-signing-sample
  labels:
    app: image-signing-verifier
    app.kubernetes.io/name: verify-signed
    app.kubernetes.io/part-of: eks-nitro-sandbox-samples
spec:
  runtimeClassName: isolated-sandbox
  hostname: verify-signed
  serviceAccountName: image-signing-verifier
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    # kubelet chowns the /scratch emptyDir to this gid and makes it
    # group-writable, so uid 65534 can write HOME and TMPDIR under a read-only root.
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: main
      image: POSITIVE_IMAGE_URI
      imagePullPolicy: IfNotPresent
      env:
        - name: HOME
          value: /scratch
        - name: TMPDIR
          value: /scratch
        # The in-guest ECR credential helper and AWS SDK need a Region; set it
        # explicitly rather than relying on the in-guest metadata surrogate.
        - name: AWS_REGION
          value: DEMO_AWS_REGION
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: scratch
          mountPath: /scratch
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
  volumes:
    - name: scratch
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: verify-unsigned
  namespace: image-signing-sample
  labels:
    app: image-signing-verifier
    app.kubernetes.io/name: verify-unsigned
    app.kubernetes.io/part-of: eks-nitro-sandbox-samples
spec:
  runtimeClassName: isolated-sandbox
  hostname: verify-unsigned
  serviceAccountName: image-signing-verifier
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: main
      image: NEGATIVE_IMAGE_URI
      imagePullPolicy: IfNotPresent
      env:
        - name: HOME
          value: /scratch
        - name: TMPDIR
          value: /scratch
        - name: AWS_REGION
          value: DEMO_AWS_REGION
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: scratch
          mountPath: /scratch
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
  volumes:
    - name: scratch
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: verify-signed-denied
  namespace: image-signing-sample
  labels:
    app.kubernetes.io/name: verify-signed-denied
    app.kubernetes.io/part-of: eks-nitro-sandbox-samples
  annotations:
    # The one line that removes the guest's network device. Registry-backed
    # verification cannot pull the signature from ECR here: that is the point.
    sandbox.amazonaws.com/network-isolated: "true"
spec:
  runtimeClassName: isolated-sandbox
  hostname: verify-signed-denied
  serviceAccountName: image-signing-verifier
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: main
      image: POSITIVE_IMAGE_URI
      imagePullPolicy: IfNotPresent
      env:
        - name: HOME
          value: /scratch
        - name: TMPDIR
          value: /scratch
        - name: AWS_REGION
          value: DEMO_AWS_REGION
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: scratch
          mountPath: /scratch
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
  volumes:
    - name: scratch
      emptyDir: {}
