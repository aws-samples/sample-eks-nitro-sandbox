# Turns on the VPC CNI Network Policy Controller for an EKS Auto Mode cluster, once
# per cluster. Until this exists, NetworkPolicy and ApplicationNetworkPolicy objects
# are accepted but not enforced.
# https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
apiVersion: v1
kind: ConfigMap
metadata:
  name: amazon-vpc-cni
  namespace: kube-system
data:
  enable-network-policy-controller: "true"
