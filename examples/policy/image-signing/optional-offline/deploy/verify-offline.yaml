# Optional variant: a network-isolated pod that verifies the signature with no
# network at all. build-offline.sh renders OFFLINE_IMAGE_URI to the pushed image
# (by digest). The node pulls the image before the guest boots; the guest then
# comes up with no network device and verifies the baked-in OCI layout from disk.
apiVersion: v1
kind: Pod
metadata:
  name: verify-offline
  namespace: image-signing-sample
  labels:
    app.kubernetes.io/name: verify-offline
    app.kubernetes.io/part-of: eks-nitro-sandbox-samples
  annotations:
    # No network device at all: the same annotation as verify-signed-denied. The
    # point of this variant is that verification still succeeds here, from disk.
    sandbox.amazonaws.com/network-isolated: "true"
spec:
  runtimeClassName: isolated-sandbox
  hostname: verify-offline
  serviceAccountName: image-signing-verifier
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: main
      image: OFFLINE_IMAGE_URI
      imagePullPolicy: IfNotPresent
      workingDir: /var/lib/image-signing/layout
      env:
        - name: HOME
          value: /scratch
        - name: TMPDIR
          value: /scratch
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: scratch
          mountPath: /scratch
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
  volumes:
    - name: scratch
      emptyDir: {}
