# The analyst's ServiceAccount, shared by every Subagent security sample.
#
# automountServiceAccountToken: false, so the ordinary Kubernetes token is not projected
# into the pod. That does not disable EKS Pod Identity, which delivers AWS credentials
# through its own endpoint inside the sandbox; it removes a token the restricted tool
# roles would otherwise find on disk.
#
# The Pod Identity association is created by the sample's setup script, not here, because
# it names an IAM role ARN in the reader's own account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analyst
  namespace: <NAMESPACE>
automountServiceAccountToken: false
