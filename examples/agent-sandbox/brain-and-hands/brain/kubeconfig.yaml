# The in-cluster kubeconfig the brain's kubectl uses.
#
# kubectl does not read the mounted ServiceAccount token on its own the way a
# client library's in-cluster configuration does, so this points it at the
# projected token and the API server's CA. The token is the brain
# ServiceAccount's, so every claim, exec, cp and logs call is authorized by the
# Role in deploy/rbac.yaml.
#
# This is the Kubernetes API credential. It is unrelated to the brain's Bedrock
# credential, which EKS Pod Identity delivers separately.
#
# The namespace is left out on purpose: brain/sandbox_tool.py passes -n on every
# call from the HANDS_NAMESPACE environment variable, so the namespace the brain
# works in comes from the pod spec and never from this file.
apiVersion: v1
kind: Config
clusters:
  - name: in-cluster
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
contexts:
  - name: in-cluster
    context:
      cluster: in-cluster
      user: brain
current-context: in-cluster
users:
  - name: brain
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
