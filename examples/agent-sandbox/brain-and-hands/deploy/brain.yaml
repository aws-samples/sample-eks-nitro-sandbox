# The brain: an ordinary pod, with model access and no shell of its own.
#
# There is no runtimeClassName here on purpose. The brain is not sandboxed: it
# reasons, and it holds the credentials, so it is the part that has a network.
# The sandbox is the OTHER pod. This one can reach the network but has no tool
# that runs a command; the one it runs commands in can be reached only by this
# pod and can open no connection of its own (deploy/warm-pool.yaml).
#
# Read that split for what it is. Code running in the hands cannot open a
# connection of its own. It is NOT an exfiltration boundary: the output of every
# command comes back to this pod and goes into the next model request, and
# nothing in this sample restricts where this pod can connect. What the split
# buys is that attacker-controlled code never runs on the half that has the
# network, not that data in the hands cannot leave.
#
# ./scripts/setup.sh fills in <NAMESPACE>, <BRAIN_IMAGE>, <AWS_REGION> and
# <BEDROCK_MODEL_ID> at apply time, and creates the hands-token Secret this pod
# mounts. Never apply this file with a placeholder in place.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/part-of: brain-and-hands
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brain
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: brain-and-hands
        # What the Deployment's own selector matches.
        app: brain
    spec:
      serviceAccountName: brain
      # No <SERVICE>_HOST/_PORT variables injected into the agent's environment.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Makes the mounted token file group-readable by the agent's user.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: brain
          image: <BRAIN_IMAGE>
          imagePullPolicy: IfNotPresent
          # Idle. You drive the agent yourself with kubectl exec, so nothing
          # this sample shows depends on a loop running here.
          command: ["sleep", "infinity"]
          env:
            # Send the agent's model calls to Amazon Bedrock. The credentials
            # come from the EKS Pod Identity association on this pod's
            # ServiceAccount, resolved by the AWS SDK's default chain.
            - { name: CLAUDE_CODE_USE_BEDROCK, value: "1" }
            - { name: AWS_REGION,              value: <AWS_REGION> }
            - { name: AWS_DEFAULT_REGION,      value: <AWS_REGION> }
            - { name: ANTHROPIC_MODEL,         value: <BEDROCK_MODEL_ID> }
            # Read by brain/hands_mcp.py. The pool it claims from and the
            # namespace it claims in are configuration, hidden from the model,
            # so it cannot point the tools somewhere else.
            - { name: HANDS_NAMESPACE,  value: <NAMESPACE> }
            - { name: HANDS_WARMPOOL,   value: hands-pool }
            - { name: HANDS_TOKEN_FILE, value: /var/run/hands/token }
            # Read by the agent-sandbox MCP server. sandboxd-in-cluster dials
            # sandboxd in the claimed pod directly: gRPC on 9090 for commands,
            # REST on 8080 for files. in-cluster-pod-ip takes the address from
            # the Sandbox's status.podIPs, so the template needs no Service.
            - { name: K8S_SANDBOX_CONNECTION__TYPE, value: sandboxd-in-cluster }
            - { name: K8S_SANDBOX_CONNECTION__MODE, value: in-cluster-pod-ip }
            # The server's /readyz probe lists claims here. Unused over stdio,
            # but set so its default ("default") never names a namespace the
            # brain has no access to.
            - { name: K8S_SANDBOX_PROBE_NAMESPACE,  value: <NAMESPACE> }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The bearer token sandboxd in the hands requires. Mounted as a file
            # and read by brain/hands_mcp.py, so it is never in this pod's spec,
            # its environment or a command line.
            - { name: hands-token, mountPath: /var/run/hands, readOnly: true }
          # No CPU or memory requests or limits: the brain is an ordinary pod,
          # and what it needs is whatever model client you put in it.
          #
          # No other volumes. The image's own /workspace and /home/agent are
          # writable by the user the container runs as, which is where the agent
          # keeps its session state. An emptyDir over /home/agent would hide the
          # agent configuration the image bakes in there.
      volumes:
        - name: hands-token
          secret:
            secretName: hands-token  # pragma: allowlist secret -- the Secret's name, not a value
            defaultMode: 0440
            items:
              - { key: token, path: token }
