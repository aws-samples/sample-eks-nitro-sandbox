# The brain's identity, and the whole of what it may do on the Kubernetes API.
#
# The brain claims a pod from the pool and drives it with exec, cp and logs. It
# cannot create or delete a pod, cannot reach another namespace, and has nothing
# cluster-scoped.
#
# Read the exec and log rules honestly: Kubernetes RBAC selects resources by
# name, never by label, and the pods a warm pool hands out have generated names.
# So these rules cover EVERY pod in this namespace, the brain's own pod
# included. The namespace is the boundary, which is why only the brain and the
# hands belong in it. Narrowing the brain to the one pod its claim adopted
# happens a layer up, in brain/sandbox_tool.py, which never takes a pod name as
# a tool argument. That is an application-level control, not RBAC enforcement,
# and it is the softer of the two.
#
# <NAMESPACE> is filled in at apply time by ./scripts/setup.sh from the
# NAMESPACE variable. Never apply this file with the placeholder in place.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brain
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/part-of: brain-and-hands
# automountServiceAccountToken stays at its default, true: the brain's kubectl
# authenticates to the Kubernetes API with this ServiceAccount's token. Its
# Bedrock credentials arrive separately, through the EKS Pod Identity
# association ./scripts/setup.sh creates for this same ServiceAccount. The two
# are unrelated.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: brain
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/part-of: brain-and-hands
rules:
  # Claim: create a SandboxClaim, watch it until it names a pod, and delete it
  # when the session ends. Reading the Sandbox is how the tool resolves the pod.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # Read pods, to wait for the claimed one to be Ready. No create, no delete:
  # the brain cannot make a pod of its own, sandboxed or not.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Run commands and move files. Both verbs on pods/exec: kubectl's WebSocket
  # exec executor issues a GET and falls back to a SPDY POST, so an exec that
  # works whatever the client version needs create and get. kubectl cp goes
  # through the same subresource.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: brain
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/part-of: brain-and-hands
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: brain
subjects:
  - kind: ServiceAccount
    name: brain
    namespace: <NAMESPACE>
