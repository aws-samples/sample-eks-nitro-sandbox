# The StorageClass the workspace claim uses. EKS Auto Mode does not create a
# StorageClass for you: you create one that references ebs.csi.eks.amazonaws.com.
# (Amazon EKS User Guide, Create a storage class.)
#
# This is a cluster-wide object, so the reader applies it once, as a page step,
# the way the coding agent page turns on network policy enforcement. The scripts
# only check it is present with the right provisioner; they never create, patch
# or label a StorageClass.
#
# It is NOT marked the cluster default (no storageclass.kubernetes.io/is-default-class
# annotation): the workspace claim names the class explicitly, and marking a class
# default would change every claim on the cluster that names no class.
#
#   kubectl apply -f deploy/storage-class.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: auto-ebs-sc
# Keep a pod that needs this volume on Auto Mode nodes, which matters on a cluster
# that has both Auto Mode and other nodes.
allowedTopologies:
- matchLabelExpressions:
  - key: eks.amazonaws.com/compute-type
    values:
    - auto
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  encrypted: "true"
