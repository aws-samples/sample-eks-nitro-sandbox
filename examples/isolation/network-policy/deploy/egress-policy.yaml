# A standard Kubernetes NetworkPolicy -- the kind platform teams already use, with no
# sandbox-specific fields. It selects BOTH clients (app: netpol-client) and governs
# their egress:
#
#   - allow egress to the web-allowed server on TCP 8080
#   - allow egress to CoreDNS on UDP and TCP 53, so name lookups keep working
#   - deny everything else, which is the default for the selected pods once policyTypes
#     lists Egress
#
# Egress to web-blocked matches no allow rule, so it is refused. The same policy applies
# to client-standard (an ordinary pod) and client-sandboxed (runtimeClassName:
# isolated-sandbox): the ordinary client is the control that shows the result means what
# the page says it means.
#
# This is networking.k8s.io/v1, not the Auto Mode ApplicationNetworkPolicy. It selects
# by pod and never by hostname; the optional variant in app-egress-policy.yaml shows the
# hostname form.
#
# DNS (port 53) is allowed to one address only: <COREDNS_CIDR>, the cluster's DNS address,
# which is the nameserver in every pod's resolv.conf. On EKS Auto Mode the node answers
# it; there is no kube-dns Service. scripts/coredns-cidr-from-service.sh works it out from
# the kubernetes Service's clusterIP (10.100.0.1 gives 10.100.0.10/32, fd12:3456:789a::1
# gives fd12:3456:789a::a/128 on IPv6), and the setup fills it in. Port 53 to any address
# would let code in the sandbox reach any DNS server on the internet, and so send data out
# over DNS or reach a VPN listening on port 53 (#226).
#
# scripts/run-comparison.sh fills in <COREDNS_CIDR> when it applies this file. To apply it
# by hand, replace <COREDNS_CIDR> first (see the README).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-client-egress
spec:
  podSelector:
    matchLabels:
      app: netpol-client
  policyTypes:
    - Egress
  egress:
    # Allow: the web-allowed server, by its pod label, on its port.
    - to:
        - podSelector:
            matchLabels:
              app: web-allowed
      ports:
        - { protocol: TCP, port: 8080 }
    # Allow: DNS on port 53 to the cluster's DNS address only, so the clients can resolve names.
    - to:
        - ipBlock: { cidr: <COREDNS_CIDR> }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
