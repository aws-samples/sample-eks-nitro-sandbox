# web-allowed: a stock HTTP server the egress policy will ALLOW the clients to reach.
# It is an ordinary pod (no runtimeClassName) and is reached by its pod IP on the
# ClusterIP Service's port, so the sample needs no Ingress, LoadBalancer or NodePort.
apiVersion: v1
kind: Pod
metadata:
  name: web-allowed
  labels:
    app: web-allowed
spec:
  containers:
    - name: web
      image: public.ecr.aws/docker/library/python:3.12-alpine
      command: ["python3", "-m", "http.server", "8080"]
      workingDir: /srv
      ports:
        - { containerPort: 8080 }
      resources:
        requests: { cpu: "100m", memory: 64Mi }
        limits:   { cpu: "250m", memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web-allowed
spec:
  selector:
    app: web-allowed
  ports:
    - { protocol: TCP, port: 8080, targetPort: 8080 }
