# OPTIONAL variant control: an ordinary pod for the hostname-egress (ApplicationNetworkPolicy)
# comparison. Identical to client-sandboxed-dns (including its hardening) except it sets no
# runtimeClassName.
apiVersion: v1
kind: Pod
metadata:
  name: client-standard-dns
  labels:
    app: netpol-client-dns      # the ApplicationNetworkPolicy selects this label
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: public.ecr.aws/docker/library/alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: "250m", memory: 128Mi }
        limits:   { cpu: "500m", memory: 256Mi }
