# OPTIONAL variant: egress by hostname.
#
# A standard NetworkPolicy can only allow addresses (pods, namespaces, CIDRs). The EKS
# Auto Mode ApplicationNetworkPolicy accepts the same fields PLUS domainNames in an
# egress rule, so you can allow an AWS endpoint by name. This policy selects a second
# pair of identical clients (app: netpol-client-dns) and allows egress only to CoreDNS
# and to one AWS endpoint by name; a second AWS endpoint, allowed by no rule, is refused.
#
# This reuses the pattern from Getting started > Coding agent, which restricts a coding
# agent's egress to Bedrock and GitHub by name. It is marked optional because it needs
# the same cluster-wide enforcement, and shows name-based egress rather than the
# pod-to-pod egress the main sample shows.
#
# <COREDNS_IP> is your cluster's DNS address, the kubelet's clusterDNS, and <AWS_REGION>
# your Region, both filled in by scripts/run-dns-comparison.sh (or by hand, from one node;
# needs "list" on nodes and "get" on nodes/proxy):
#   kubectl get --raw "/api/v1/nodes/$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')/proxy/configz"
#   and take kubeletconfig.clusterDNS[0]
# On EKS Auto Mode CoreDNS runs locally on each instance, at an address derived from the
# cluster's service CIDR that is fixed for the life of the cluster, so DNS egress is
# allowed with an ipBlock on that one address. The same address is also the kube-dns
# Service's ClusterIP -- that Service does exist on Auto Mode; where every node is
# Auto Mode it has no endpoints, because CoreDNS is on the node and the coredns
# Deployment is scaled to zero -- and the guide below derives it
# from serviceIpv4Cidr instead. All three reads give the same value; the script reads the
# kubelet because that is the value handed to the pod.
# https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: netpol-client-dns-egress
spec:
  podSelector:
    matchLabels:
      app: netpol-client-dns
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock: { cidr: <COREDNS_IP>/32 }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - domainNames:
            - sts.<AWS_REGION>.amazonaws.com    # allowed by name
      ports:
        - { protocol: TCP, port: 443 }
