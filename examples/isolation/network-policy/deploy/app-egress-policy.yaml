# OPTIONAL variant: egress by hostname.
#
# A standard NetworkPolicy can only allow addresses (pods, namespaces, CIDRs). The EKS
# Auto Mode ApplicationNetworkPolicy accepts the same fields PLUS domainNames in an
# egress rule, so you can allow an AWS endpoint by name. This policy selects a second
# pair of identical clients (app: netpol-client-dns) and allows egress only to CoreDNS
# and to one AWS endpoint by name; a second AWS endpoint, allowed by no rule, is refused.
#
# This reuses the pattern from Getting started > Coding agent, which restricts a coding
# agent's egress to Bedrock and GitHub by name. It is marked optional because it needs
# the same cluster-wide enforcement, and shows name-based egress rather than the
# pod-to-pod egress the main sample shows.
#
# DNS (port 53) is allowed to one address only: <COREDNS_CIDR>, the cluster's DNS address,
# which is the nameserver in every pod's resolv.conf. On EKS Auto Mode the node answers
# it; there is no kube-dns Service. scripts/coredns-cidr-from-service.sh works it out from
# the kubernetes Service's clusterIP (10.100.0.1 gives 10.100.0.10/32, fd12:3456:789a::1
# gives fd12:3456:789a::a/128 on IPv6), and the setup fills it in. Port 53 to any address
# would let code in the sandbox reach any DNS server on the internet, and so send data out
# over DNS or reach a VPN listening on port 53 (#226).
#
# <AWS_REGION> is your Region, and <COREDNS_CIDR> the cluster's DNS address. Both are filled
# in by scripts/run-dns-comparison.sh (or by hand); the Region is for the one AWS endpoint
# allowed by name below.
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: netpol-client-dns-egress
spec:
  podSelector:
    matchLabels:
      app: netpol-client-dns
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock: { cidr: <COREDNS_CIDR> }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - domainNames:
            - sts.<AWS_REGION>.amazonaws.com    # allowed by name
      ports:
        - { protocol: TCP, port: 443 }
