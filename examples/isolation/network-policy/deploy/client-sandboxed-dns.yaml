# OPTIONAL variant: the sandboxed client for the hostname-egress (ApplicationNetworkPolicy)
# comparison. Identical to client-standard-dns, differing only in the one line below.
apiVersion: v1
kind: Pod
metadata:
  name: client-sandboxed-dns
  labels:
    app: netpol-client-dns      # the SAME label the policy selects on client-standard-dns
spec:
  runtimeClassName: isolated-sandbox   # <-- the only field that differs
  containers:
    - name: client
      image: public.ecr.aws/docker/library/alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
      resources:
        requests: { cpu: "250m", memory: 128Mi }
        limits:   { cpu: "500m", memory: 256Mi }
