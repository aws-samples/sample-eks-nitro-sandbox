# The GitLab Runner manager: an ordinary pod that creates one job pod per CI job.
#
# Nothing here carries runtimeClassName. The manager is the long-lived component that holds
# the runner authentication token and talks to GitLab; the job pods it creates are what run
# pipeline code, and those are the sandboxes. Which runtime class they get is decided in
# runner/config.toml.template, not here.
#
# The Role is namespaced, not cluster-wide: the manager creates job pods only in this
# sample's own namespace, which is what `namespace` in config.toml names.
#
# scripts/register-runner.sh renders <NAMESPACE> and <RUNNER_SECRET> before applying.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/part-of: gitlab-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/part-of: gitlab-ci
rules:
  # What the Kubernetes executor needs to build, watch, stream and tear down a job pod.
  # Taken from the GitLab Runner Kubernetes executor documentation.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/part-of: gitlab-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: <NAMESPACE>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/part-of: gitlab-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-runner
  template:
    metadata:
      labels:
        app: gitlab-runner
        app.kubernetes.io/part-of: gitlab-ci
      annotations:
        # The resourceVersion of the Secret holding config.toml, rendered by
        # scripts/bootstrap-runner.sh. It is what makes the Deployment roll when the config
        # changes: the container copies the mounted config to a writable path at start-up,
        # so a pod that is already running keeps the config it started with, however many
        # times the Secret is rewritten. Measured: after a re-run that minted a new token,
        # the manager carried on with the old one, GitLab never heard from the new runner,
        # and the only sign was a wait that timed out.
        #
        # A resourceVersion and not a hash of the config: it changes on every write to the
        # Secret, and no part of the credential goes into a pod annotation.
        gitlab-ci/runner-config-version: "<RUNNER_SECRET_VERSION>"
    spec:
      serviceAccountName: gitlab-runner
      # No automatic token mount. The manager does call the Kubernetes API, to create, watch
      # and delete job pods, so the token it needs is mounted explicitly by the
      # kube-api-access volume below, at the path the automatic mount would use, with a
      # lifetime this file states.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Makes the mounted config and token files group-readable by the manager's user.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: gitlab/gitlab-runner:v19.5.0
          # No port and no Service: the manager only calls out, to GitLab and the API server.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The config, token and all, is mounted from the Secret at /config and copied to
          # the working copy at start-up: gitlab-runner rewrites its own config file when it
          # reloads, and a Secret mount is read-only. The copy lives in an emptyDir that
          # never leaves this pod.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              install -m 600 /config/config.toml /etc/gitlab-runner/config.toml
              exec gitlab-runner run --working-directory=/home/gitlab-runner \
                --config=/etc/gitlab-runner/config.toml
          env:
            # The working directory below, which is an emptyDir: the root filesystem is
            # read-only.
            - { name: HOME, value: /home/gitlab-runner }
          volumeMounts:
            - { name: config-secret, mountPath: /config,            readOnly: true }
            - { name: config,        mountPath: /etc/gitlab-runner }
            - { name: work,          mountPath: /home/gitlab-runner }
            - { name: tmp,           mountPath: /tmp }
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            # The manager polls GitLab and talks to the API server; the work happens in the
            # job pods. These are this sample's values, not a GitLab Runner minimum.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config-secret
          secret:
            secretName: <RUNNER_SECRET>
            # Group-readable, for fsGroup above: the manager does not run as root.
            defaultMode: 0440
        - name: config
          emptyDir: {}
        - { name: work, emptyDir: {} }
        - { name: tmp,  emptyDir: {} }
        # The ServiceAccount token, mounted by hand in place of the automatic mount.
        # expirationSeconds is 3600, not the automatic mount's 3607: the API server extends
        # only a 3607-second token past its stated lifetime, so this token is valid for one
        # hour. The kubelet rotates the file before it expires.
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - { key: ca.crt, path: ca.crt }
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
