# The pipeline this sample runs on the in-cluster GitLab. One job, one job pod, and nothing
# in this file about sandboxes: the runner puts every job pod it creates in one, so a
# pipeline written before the runner was ever configured is isolated too.
#
# scripts/bootstrap-runner.sh commits this file to the project it creates.

stages:
  - build

# The job that forces the choice this sample takes away: a Docker daemon of its own, a real
# multi-stage build and a run of the image it produced, all inside this job pod's sandbox.
#
# It reads the sandbox evidence first, at the top of its own step and before the daemon is
# started or anything is built, so everything that follows is known to have run in a guest of
# its own: the guest's kernel build from `uname -rv`, this pod's own boot from /proc/uptime,
# the virtio disks from /sys/block, and the product name the guest reports.
#
# `privileged = true` in the runner's config.toml is what lets the daemon start, and the
# kernel it is privileged against is this pod's own guest, which `docker info` reports below.
#
# The daemon runs in the job's own container, on a Unix socket, started the way the
# docker-builds sample starts it. Not as a `services:` entry with DOCKER_HOST on TCP, which
# is the more usual GitLab shape: `docker:dind` with TLS off listens on 0.0.0.0:2375, and a
# job pod has an address on the VPC, so that would put an unauthenticated daemon on the
# cluster network. This sample ships no network policy, so nothing here would restrict who
# could reach it. A Unix socket in the pod has no such reach, and needs no certificates.
docker-build:
  stage: build
  image: public.ecr.aws/docker/library/docker:29.9.2-dind
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - echo "pod $(hostname), job $CI_JOB_ID of pipeline $CI_PIPELINE_ID"
    - echo "--- its own kernel (an ordinary pod reports the node's) ---"
    - uname -rv
    - echo "--- its own boot (matches this pod's age, not the node's uptime) ---"
    - cut -d' ' -f1 /proc/uptime
    - echo "--- virtio disks (an ordinary pod sees the instance's nvme devices) ---"
    - ls /sys/block
    - echo "--- what the guest reports as its product (an ordinary pod reads the EC2 instance type) ---"
    - cat /sys/class/dmi/id/product_name
    - echo "--- the process this job script runs as ---"
    - id
    # The Kubernetes executor runs its own shell as the container's command, so the dind
    # image's entrypoint does not run and the daemon is started here, after the readings
    # above. `--host` names only the socket: no TCP listener is opened at all.
    - echo "--- the daemon this job starts, on its own Unix socket ---"
    - dockerd --host=unix:///var/run/docker.sock >/tmp/dockerd.log 2>&1 &
    - |
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        [ "$i" -lt 90 ] || { echo "the daemon did not answer within 180s"; exit 1; }
        sleep 2
      done
    - docker info --format 'daemon {{.ServerVersion}}, storage driver {{.Driver}}, {{.NCPU}} CPU, kernel {{.KernelVersion}}'
    - echo "--- a multi-stage build context ---"
    - mkdir -p build-context
    - cp ci/main.go ci/go.mod ci/Dockerfile build-context/
    - cd build-context
    - echo "--- docker build, in this pod's sandbox ---"
    - docker build -t hello-nitro:$CI_PIPELINE_ID .
    - echo "--- docker run, of the image this build produced ---"
    - docker run --rm hello-nitro:$CI_PIPELINE_ID
    # Quoted as a YAML string. A plain scalar holding a colon and a space is parsed as a
    # mapping, and GitLab then refuses the whole job with "script config should be a string
    # or a nested array of strings".
    - 'echo "--- and what a nested container sees: the same guest kernel ---"'
    - docker run --rm public.ecr.aws/docker/library/alpine:3.24.3 sh -c 'uname -rv; ls /sys/block; id'
