# Copy this file into your test repository's .github/workflows/ and trigger it.
#
# It stands in for an untrusted pull request. On purpose it does the two things
# that make CI dangerous: a `docker build` of an attacker-shaped Dockerfile,
# which needs a real Docker daemon, and a unit-test run, which is arbitrary code
# execution. Both run on the job's own in-pod Docker daemon, inside the job's
# own sandbox.
#
# It is an untrusted-shaped inline workload: it does not check out pull-request
# contents. The property shown is "a privileged build plus arbitrary code,
# contained to a per-job sandbox". The sample's page describes running a genuine
# fork pull request instead.
#
# Every step here runs under the sample's egress policy, which allows only DNS,
# the GitHub hosts this workflow needs and the base-image registry. So no step
# may reach a package index: the build does not run `apk add`, and the tests use
# the Python standard library rather than installing pytest. Adding either would
# need its host on the policy, which the sample's page explains.
#
# `runs-on` must equal the Helm release name of the runner scale set, which is
# RUNNER_SCALE_SET_NAME in the sample's .env (default: github-actions-nitro).
name: untrusted-pr
on:
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: >-
          Seconds to hold the runner pod open at the end, so the sample's page
          can inspect it while it is still running. ARC deletes the pod as soon
          as the job ends.
        required: false
        default: "240"
  pull_request:

jobs:
  untrusted-build-and-test:
    runs-on: github-actions-nitro
    steps:
      # 1. What the job can see of the machine it runs on. The page compares
      #    these three readings with an ordinary pod's on the same node.
      - name: Sandbox evidence
        run: |
          echo "=== SANDBOX-EVIDENCE-BEGIN ==="
          echo "kernel:        $(uname -rv)"
          echo "uptime:        $(cut -d' ' -f1 /proc/uptime) seconds"
          echo "block devices: $(ls /sys/block | tr '\n' ' ')"
          echo "product name:  $(cat /sys/class/dmi/id/product_name 2>/dev/null || echo unreadable)"
          echo "cpus:          $(nproc)"
          grep MemTotal /proc/meminfo
          echo "=== SANDBOX-EVIDENCE-END ==="

      # 2. No credential reached this pod. Printed by NAME, never by value.
      - name: Credentials visible to the job, by name
        run: |
          echo "=== CREDENTIAL-NAMES-BEGIN ==="
          echo "--- GitHub admin credential variable names (expect none) ---"
          env | cut -d= -f1 | grep -iE 'github_token|github_app|github_pat' || echo "none"
          echo "--- AWS variable names (expect none) ---"
          env | cut -d= -f1 | grep -E '^AWS_' || echo "none"
          echo "=== CREDENTIAL-NAMES-END ==="

      # 3. The privileged build. The Dockerfile is written here rather than
      #    checked out so the job is self-contained. It installs no package:
      #    the egress policy allows no package index, by design.
      - name: Untrusted docker build
        run: |
          echo "=== DOCKER-BUILD-BEGIN ==="
          mkdir -p /tmp/app && cd /tmp/app
          cat > Dockerfile <<'EOF'
          FROM public.ecr.aws/docker/library/alpine:3.20
          RUN echo "building untrusted pull request image"
          RUN id && echo "UNTRUSTED-BUILD-RAN" > /built.txt
          CMD ["cat", "/built.txt"]
          EOF
          docker build -t untrusted-pr:ci .
          docker run --rm untrusted-pr:ci
          echo "DOCKER-BUILD-CONFIRMED"
          echo "=== DOCKER-BUILD-END ==="

      # 4. Arbitrary code execution, in a throwaway container on the job's own
      #    daemon, which is also how untrusted test code should be run. It uses
      #    the standard library's unittest, so it needs no package index.
      - name: Unit tests
        run: |
          echo "=== UNIT-TESTS-BEGIN ==="
          mkdir -p /tmp/tests && cd /tmp/tests
          cat > test_demo.py <<'EOF'
          import unittest


          def add(a, b):
              return a + b


          class TestDemo(unittest.TestCase):
              def test_add(self):
                  self.assertEqual(add(2, 3), 5)

              def test_upper(self):
                  self.assertEqual("nitro".upper(), "NITRO")


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          EOF
          # The test file goes in on stdin: a bind mount would resolve against
          # the dind daemon's filesystem, not this container's /tmp.
          docker run --rm -i public.ecr.aws/docker/library/python:3.12-alpine \
            sh -c 'cat > /test_demo.py && python /test_demo.py' \
            < test_demo.py
          echo "UNIT-TESTS-PASSED"
          echo "=== UNIT-TESTS-END ==="

      # 5. The egress policy, from inside the runner. One host it must allow and
      #    two it must refuse, so a pass cannot be confused with a policy that
      #    allows everything.
      - name: Egress policy, both ways
        run: |
          echo "=== EGRESS-BEGIN ==="
          for url in https://api.github.com https://example.com https://registry-1.docker.io; do
            # A refused host is the point of this step, so keep curl's exit
            # status instead of letting it end the step: GitHub runs this with
            # `bash -e`, where an unguarded non-zero exit would stop here.
            rc=0
            curl -sS -o /dev/null --connect-timeout 8 "$url" 2>/dev/null || rc=$?
            echo "$url -> exit $rc"
          done
          echo "=== EGRESS-END ==="

      # 6. Defense in depth, not the proof. These fail closed so a regression
      #    that did expose the node breaks the job rather than passing quietly.
      #    Read the page's Step 9 for what they are and are not worth: the
      #    load-bearing evidence is step 1 above.
      - name: Escape probes
        run: |
          echo "=== ESCAPE-PROBES-BEGIN ==="
          verdict=0

          # a) the node's instance-metadata credentials. Note this one is
          #    answered by the egress policy, which does not allow
          #    169.254.169.254, as well as by the sandbox.
          tok=$(curl -s --max-time 3 -X PUT "http://169.254.169.254/latest/api/token" \
                  -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)
          hdr=""; [ -n "$tok" ] && hdr="-H X-aws-ec2-metadata-token:$tok"
          role=$(curl -s --max-time 3 $hdr \
                  http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>/dev/null \
                  | head -n1 | tr -d '\r' || true)
          creds=""
          if [ -n "$role" ]; then
            creds=$(curl -s --max-time 3 $hdr \
                    "http://169.254.169.254/latest/meta-data/iam/security-credentials/$role" 2>/dev/null || true)
          fi
          if printf '%s' "$creds" | grep -q '"AccessKeyId"'; then
            echo "node-role-credentials: REACHED (bad)"; verdict=1
          else
            echo "node-role-credentials: refused"
          fi

          # b) the node's own EBS volumes, which are nvme devices, from the
          #    unprivileged runner container.
          if ls /dev/nvme* >/dev/null 2>&1; then
            echo "host-nvme-devices: VISIBLE (bad)"; verdict=1
          else
            echo "host-nvme-devices: not visible"
          fi

          # c) the same read from a PRIVILEGED container on the job's own
          #    daemon. This is the one that matters: in an ordinary pod a
          #    privileged container does see the node's nvme devices, so a
          #    sandbox is what makes this read come back empty.
          echo "--- privileged container on the job's own daemon ---"
          priv=$(docker run --rm --privileged \
                   public.ecr.aws/docker/library/alpine:3.20 \
                   sh -c 'ls /dev/nvme* 2>/dev/null; ls /sys/block | tr "\n" " "' 2>/dev/null || true)
          echo "privileged sees: $priv"
          if printf '%s' "$priv" | grep -q 'nvme'; then
            echo "privileged-host-nvme: VISIBLE (bad)"; verdict=1
          else
            echo "privileged-host-nvme: not visible"
          fi

          # d) the node's container runtime socket
          if [ -S /run/containerd/containerd.sock ] || [ -S /host/run/containerd/containerd.sock ]; then
            echo "node-containerd-socket: VISIBLE (bad)"; verdict=1
          else
            echo "node-containerd-socket: not visible"
          fi

          echo "=== ESCAPE-PROBES-END ==="
          if [ "$verdict" -eq 0 ]; then
            echo "ESCAPE-PROBES: all contained"
          else
            echo "ESCAPE-PROBES: something reached the node"
            exit 1
          fi

      # 7. Hold the pod open. ARC deletes the runner pod as soon as the job
      #    ends, so without this there is no live pod left to inspect, and the
      #    page's Step 6 and Step 8 commands would return nothing.
      - name: Hold the pod open for inspection
        run: |
          secs="${{ github.event.inputs.hold_seconds || '240' }}"
          echo "=== HOLDING-POD-OPEN for ${secs}s ==="
          echo "Inspect it now, for example:"
          echo "  kubectl get pods -n arc-runners -l actions-ephemeral-runner=True"
          sleep "$secs"
          echo "=== HOLD-COMPLETE ==="
