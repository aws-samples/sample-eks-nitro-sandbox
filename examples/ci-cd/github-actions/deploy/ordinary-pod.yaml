# An ordinary pod, for comparison only. It is not part of the runner set and no
# job ever lands on it: it exists so the page can show what the same three
# readings look like without a sandbox, on the same node as a runner pod.
#
# <NODE_NAME> is the node a runner pod ran on, which the page fills in at apply
# time so this pod lands on that same node.
apiVersion: v1
kind: Pod
metadata:
  name: ordinary-comparison
  labels:
    ManagedBy: github-actions
spec:
  # Deliberately no runtimeClassName: this is the ordinary pod.
  nodeName: <NODE_NAME>
  restartPolicy: Never
  containers:
    - name: shell
      image: public.ecr.aws/docker/library/alpine:3.20
      command: ["sleep", "600"]
