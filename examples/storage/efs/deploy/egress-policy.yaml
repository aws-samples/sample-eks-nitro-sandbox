# Egress for the EFS pods: DNS and NFS to the mount targets, nothing else.
#
# An EKS Auto Mode ApplicationNetworkPolicy is a NetworkPolicy enforced on the node,
# outside the guest, so a command inside the sandbox cannot change it. For the pods it
# selects (app: efs-shared), all ingress and all egress are denied except DNS to CoreDNS
# and NFS (TCP 2049) to the EFS mount-target addresses.
#
# test.sh renders this file before applying it:
#   <COREDNS_IP>          the CoreDNS Service address:
#                         kubectl get svc -n kube-system kube-dns -o jsonpath='{.spec.clusterIP}'
#   <MOUNT_TARGET_BLOCK>  one `- ipBlock: { cidr: <ip>/32 }` line per EFS mount-target IP,
#                         one per cluster Availability Zone:
#                         aws efs describe-mount-targets --file-system-id <fs> \
#                           --query 'MountTargets[].IpAddress'
#
# The mount targets are addressed by IP (ipBlock), not domainNames: the EFS DNS name
# resolves to these mount-target IPs, and pinning them keeps the rule to exactly the
# interfaces NFS must reach. The TLS connection is terminated inside each guest; the node
# coordinates the CSI operation but is not on the file-data path.
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: efs-shared-egress
spec:
  podSelector:
    matchLabels:
      app: efs-shared
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock: { cidr: <COREDNS_IP>/32 }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        <MOUNT_TARGET_BLOCK>
      ports:
        - { protocol: TCP, port: 2049 }
