# The Temporal server's datastore: one in-cluster PostgreSQL, serving both the
# default store and the visibility store.
#
# This file is part of the Temporal server install, which is the reader's step
# and not something this sample's scripts do: a Temporal server is a shared
# install, so if one is already on your cluster, use it as it is and skip this.
# Apply it with `kubectl -n <your temporal namespace> apply -f`, so the
# namespace is yours to choose and is not written in here.
#
# The password is NOT in this file. It comes from a Secret named
# `temporal-postgresql`, key `password`, which the page has you create from
# standard input so the password never appears on a command line. The Temporal
# chart reads the same Secret through `existingSecret`.
#
# The Temporal Helm chart installs only the server roles and bundles no
# database, so this is the lightest viable one: a single replica, SQL visibility
# and no Elasticsearch. It is a sample's datastore, not a production one: one
# replica, no backups and no connection pooler.
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgresql
  labels:
    app.kubernetes.io/name: temporal-postgresql
spec:
  # ClusterIP, reached only from inside the cluster. Never a LoadBalancer or a
  # NodePort: Temporal's own guidance is to keep the server and its datastore
  # off the public internet, like any database.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
# The visibility store needs a second database. initdb runs this once, when the
# data directory is empty, so it is not a change to an existing datastore.
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-postgresql-initdb
  labels:
    app.kubernetes.io/name: temporal-postgresql
data:
  10-visibility-database.sql: |
    CREATE DATABASE temporal_visibility;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgresql
  labels:
    app.kubernetes.io/name: temporal-postgresql
spec:
  serviceName: temporal-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-postgresql
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgresql
          # PostgreSQL 17.11, pinned by digest so a re-install gets the image
          # this sample was proved with.
          image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgresql
                  key: password
            # The data directory has to be a subdirectory of the mount, because
            # the EBS volume's lost+found would otherwise make initdb refuse.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal", "-d", "temporal"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: initdb
          configMap:
            name: temporal-postgresql-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # No storageClassName: this uses whatever your cluster's default class
        # is, because it is part of the install you run rather than something
        # the sample's scripts choose.
        resources:
          requests:
            storage: 20Gi
