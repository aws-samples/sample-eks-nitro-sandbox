# Pinned, checksum-verified inputs for the ubuntu-ami sample.
#
# One block per input. The fetch/build helpers under packages/ and scripts/ read this file
# and fail closed: a value that does not match aborts the step, with no override flag. See
# packages/SOURCES.txt for the full design record of where each input comes from and why.
#
# Format, one input per block:
#   id=<stable identifier>
#   kind=<ssm-ami|file|runtime-payload>
#   ref=<version/ref>
#   source=<public URL, SSM parameter path, or how an operator-supplied input is obtained;
#          never an internal/private location>
#   sha256=<hex digest; required for kind=file and kind=runtime-payload; "n/a" for an AMI
#          resolved by signed SSM parameter or a capability-asserted input>
#   verify=<short note on how this input is obtained and verified>
#   status=<available|operator-supplied>
# Extra keys some blocks carry:
#   file=      the file name the input is fetched or supplied under
#   subject=   (kernel patch) the commit subject the applied patch must carry
#   archive=   (runtime-payload) the id of the archive the payload ships in
#   install=   (runtime-payload) "<absolute path> <octal mode>" on the node, or "none"
#   guest_kernel= (runtime archive) the guest kernel release inside latest.eif
#
# A line is read as `key=value`; a block ends at a blank line. Unknown keys are ignored by
# the fetch helpers (forward-compatible), but `id`, `kind`, `ref`, `source` and `status` are
# required for every block.
#
# To move a pin: update this file and the corresponding entry in packages/SOURCES.txt and the
# README pin table together, re-fetch, and let the build re-verify against the new value. Do
# not edit one without the others.

# --- 1. Ubuntu 24.04 EKS-optimized base AMI (Canonical, public SSM parameter) ---------------
id=base-ami-ubuntu-2404
kind=ssm-ami
ref=k8s-1.36
source=/aws/service/canonical/ubuntu/eks/24.04/1.36/stable/current/amd64/hvm/ebs-gp3/ami-id
sha256=n/a
verify=Resolved via `aws ssm get-parameter --name <source>` for the build Region. The AMI is
  signed by Canonical/AWS; there is no separate SHA-256 to pin. The build records the
  resolved image name and AMI ID it actually used in the on-image manifest and the run
  evidence; this lock file pins the Kubernetes version, not a Region-specific AMI ID.
status=available

# --- 2. Linux kernel source (kernel.org, public, upstream-published checksum) ---------------
id=linux-kernel-source
kind=file
ref=6.18.56
file=linux-6.18.56.tar.xz
source=https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.56.tar.xz
sha256=4633bbda2ab95eaf2a7af4041236451d6759c72e6946265531af4b3aacefbf89
verify=The linux-6.18.56.tar.xz line of kernel.org's
  https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc, whose signature verifies with
  the Kernel.org checksum autosigner key (fingerprint B8868C80BA62A1FFFAF5FDA9632D3A06589DA6B1,
  from kernel.org's pgpkeys repository). The tarball also verifies against its stable-release
  developer signature linux-6.18.56.tar.sign (Greg Kroah-Hartman, fingerprint
  647F28654894E3BD457199BE38DBBDC86092693E). The fetch helper re-downloads and re-verifies on
  every run; a mismatch aborts before the tarball is unpacked.
status=available

# --- 3. Host-kernel patch: AWS's public Nitro Sandbox kernel commit (GitHub) ----------------
# ONE squashed public commit on Amazon Linux's kernel tree, fetched as a git-format patch and
# applied to the kernel.org 6.18.56 tree above with `git am` in a throwaway repository.
id=host-kernel-patch
kind=file
ref=1e66c960b982c94bda76ebd0129eaecf0a68b46e
file=1e66c960b982c94bda76ebd0129eaecf0a68b46e.patch
source=https://github.com/amazonlinux/linux/commit/1e66c960b982c94bda76ebd0129eaecf0a68b46e.patch
sha256=051ede9dff52d24fb7ff47dd783a9eb2f6b18c742dbf151926cb48304d72924b
subject=nitro_enclaves: Amazon Nitro Enclaves extension (port onto 6.18.48)
verify=GitHub serves any commit as a git-format patch at <commit URL>.patch. The SHA-256 is the
  value the GA node-build bundle (nitro-sandbox-ga-20261028) pins, re-confirmed by this sample
  on a fresh download. packages/fetch-kernel-patch.sh checks the SHA-256 and that the patch's
  first line names this commit before the patch takes its final name; scripts/10-kernel.sh
  checks it applies as exactly one commit with the subject above.
status=available

# --- 4. erofs-utils source (kernel.org cgit snapshot of the tagged release) -----------------
id=erofs-utils-source
kind=file
ref=1.8.10
file=erofs-utils-1.8.10.tar.gz
source=https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/erofs-utils-1.8.10.tar.gz
sha256=05eb4edebe11decce6ecb34e98d2f80c8cd283c2f2967d8ba7efd58418570514
verify=This is a cgit-generated snapshot of a tag, not an upstream release tarball with its
  own published checksum, so the SHA-256 is pinned BY THIS SAMPLE (confirmed identical
  across independent fetches, most recently on 2026-10-28), not quoted from upstream. A
  re-fetch that disagrees means cgit's archive generation changed; re-confirm by hand and
  update this file and packages/SOURCES.txt together before trusting a new value. The build
  checks `mkfs.erofs --version` reports this version and records the installed binary's own
  SHA-256 into the on-image manifest.
status=available

# --- 5. Nitro sandbox runtime binaries + guest image (operator-supplied; preview) -----------
# One flat zip from the GA node-build bundle. It is preview-gated: there is no public
# download, so the operator obtains it from their AWS account team and places it at
# RUNTIME_ARTIFACTS_DIR (default: the repository's gitignored tmp/issue10/run/runtime). This
# sample never fetches, embeds, uploads anywhere public or commits it.
# packages/fetch-runtime-artifacts.sh verifies the archive SHA-256 below, then fails closed
# unless the SHA256SUMS inside lists every unpacked file exactly once, every hash matches, and
# every payload matches its runtime-payload pin below.
id=runtime-archive
kind=file
ref=nitro-sandbox-ga-20261028
file=nitro-sandbox-binaries-2026-10-28.zip
source=operator-supplied: obtained from your AWS account team while Nitro sandboxes are in preview; no public download
sha256=6830dc8d0acb356b06753fed609ebb9f03a182e340eaa27cd9ed171f7667ba40
size=148284530
guest_kernel=6.18.54
verify=Archive SHA-256 as shipped in the GA node-build bundle nitro-sandbox-ga-20261028,
  re-computed by this sample on the operator's copy. Its own SHA256SUMS covers all eight
  payloads below; each payload is also pinned here, so a re-packed archive whose SHA256SUMS
  was edited to match is still refused.
status=operator-supplied

id=runtime-payload-containerd-shim-nitro-sandbox-v2
kind=runtime-payload
archive=runtime-archive
ref=nitro-sandbox-ga-20261028
file=containerd-shim-nitro-sandbox-v2
source=member of runtime-archive
sha256=991a3786577d19ec3ee5005c90530cc1b2464c052af0218b1064f54c3c2aa7c9
install=/usr/sbin/containerd-shim-nitro-sandbox-v2 0755
verify=SHA256SUMS line in runtime-archive; the shim also serves the CRI proxy (cri-proxy subcommand). It reports its version as dev.
status=operator-supplied

