# Reference copy of the dedicated managed node group's taint, as scripts/join-nodegroup.sh
# passes it to `aws eks create-nodegroup --taints`. Kept here so the README can show the
# taint definition next to the pods that tolerate it, without parsing it out of the script.
#
# This is documentation, not something kubectl applies: EKS manages the node group's
# taints as part of the node group resource itself, not as a separate Kubernetes object.
taints:
  - key: sandbox.preview/ubuntu-ami
    value: "true"
    effect: NO_SCHEDULE
