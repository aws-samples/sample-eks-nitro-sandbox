# REJECT control for test.sh's AppArmor step: this pod names an AppArmor profile that does
# not exist on the node. It must be refused (Pending with an AppArmor-related event/reason),
# proving the accept path in pod-isolated-sandbox.yaml is a real, scoped selection and not a
# no-op. test.sh deletes this pod after reading its status; it is never left running.
apiVersion: v1
kind: Pod
metadata:
  name: apparmor-reject-control
  namespace: ubuntu-ami-sample
  labels:
    app: apparmor-reject-control
  annotations:
    container.apparmor.security.beta.kubernetes.io/main: localhost/profile-that-does-not-exist
spec:
  nodeSelector:
    eks.amazonaws.com/nodegroup: "@NODEGROUP@"
  tolerations:
    - key: sandbox.preview/ubuntu-ami
      operator: Equal
      value: "true"
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: main
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "100m"
          memory: 64Mi
