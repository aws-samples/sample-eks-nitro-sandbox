# The COMPLETE egress policy for the validation sandbox pod. Shown in full on the README,
# as the repository's security rules require: a reader must see every rule that limits
# where code in the sandbox can connect. No Ingress, LoadBalancer or NodePort is created
# anywhere in this sample.
#
# Default-deny all ingress and egress for pods labelled app=isolated-sandbox-pod in this
# namespace, then allow only DNS (UDP and TCP 53) egress, and only to the cluster DNS pods:
# pods labelled k8s-app=kube-dns in the kube-system namespace (both selectors in ONE `to`
# entry, so a pod must match both). Port 53 to any other pod or address is refused; test.sh
# proves that with a port-53 listener in an ordinary pod. scripts/00c-check-cluster.sh checks
# the cluster's DNS pods carry that label before setup.sh applies this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolated-sandbox-pod-policy
  namespace: ubuntu-ami-sample
spec:
  podSelector:
    matchLabels:
      app: isolated-sandbox-pod
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
