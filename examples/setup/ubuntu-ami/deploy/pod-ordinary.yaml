# An ordinary (non-sandboxed) pod on the same dedicated Ubuntu node, for the kernel/device
# comparison in test.sh. It also listens on TCP port 53 (a plain HTTP listener, not DNS), the
# non-DNS port-53 endpoint test.sh uses to show the sandbox's egress policy refuses port 53 to
# anything but the cluster DNS pods. No Service exposes it. setup.sh renders @NODEGROUP@ from
# NODEGROUP_NAME and the namespace from NAMESPACE.
apiVersion: v1
kind: Pod
metadata:
  name: ordinary-pod
  namespace: ubuntu-ami-sample
  labels:
    app: ordinary-pod
spec:
  nodeSelector:
    eks.amazonaws.com/nodegroup: "@NODEGROUP@"
  tolerations:
    - key: sandbox.preview/ubuntu-ami
      operator: Equal
      value: "true"
      effect: NoSchedule
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  containers:
    - name: main
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["sh", "-ec"]
      args:
        - |
          echo "Node kernel: $(uname -r)"
          echo "Node devices:"
          ls -1 /sys/block
          python3 -m http.server 53 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep infinity
      resources:
        requests:
          cpu: "250m"
          memory: 256Mi
