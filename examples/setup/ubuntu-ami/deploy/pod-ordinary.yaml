# An ordinary (non-sandboxed) pod on the same dedicated Ubuntu node, for the kernel/device
# comparison in test.sh. setup.sh renders @NODEGROUP@ from NODEGROUP_NAME.
apiVersion: v1
kind: Pod
metadata:
  name: ordinary-pod
  namespace: ubuntu-ami-sample
  labels:
    app: ordinary-pod
spec:
  nodeSelector:
    eks.amazonaws.com/nodegroup: "@NODEGROUP@"
  tolerations:
    - key: sandbox.preview/ubuntu-ami
      operator: Equal
      value: "true"
      effect: NoSchedule
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  containers:
    - name: main
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["sh", "-ec"]
      args:
        - |
          echo "Node kernel: $(uname -r)"
          echo "Node devices:"
          ls -1 /sys/block
          sleep infinity
      resources:
        requests:
          cpu: "250m"
          memory: 256Mi
