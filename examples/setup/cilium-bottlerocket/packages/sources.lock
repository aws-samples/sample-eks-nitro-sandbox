# Pinned inputs of the sandbox AMI build. packages/lib/runtime_verify.py and
# scripts/builder/20-fetch-verify.sh read this file. A value that does not match stops the
# build. No flag skips a check.
#
# One block per input. A block ends at a blank line. Lines are key=value.
# Required in every block: id, kind, ref, source, status.
# Kinds:
#   git-tag         a git tag; the clone must be at commit= and the tag object at tag_object=
#   signed-archive  an archive whose downloaded SHA256SUM has an ECDSA P-384 signature
#                   (manifest=, manifest_sha256=, signature=, public_key=, public_key_sha256=)
#   sidecar-file    a download with a published .sha256 file beside it (sidecar=)
#   archive-member  one file in the archive block named by archive= (member= is its path)
# File blocks carry sha256= (checked by runtime_verify.py) and sha512= (checked again by the
# Bottlerocket build system, buildsys, through external-files in
# variant/packages/nitro-sandbox/Cargo.toml). The SHA-512 values were computed from files whose
# SHA-256 first matched the publisher's checksum.
# install= is "<path on the node> <mode>" or "none". The RPM spec installs the files at
# these paths.

