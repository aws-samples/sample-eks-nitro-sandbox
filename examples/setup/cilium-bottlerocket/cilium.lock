# The one source of the Cilium version for the scripts of this sample.
#
# setup.sh installs this chart at this version, and test.sh compares the live agent image tag
# with it. The scripts read the Cilium version from this file only. The page states the same
# value; after a change here, change the page and run every Cilium check again on a live
# cluster.
CILIUM_VERSION=1.20.5
CILIUM_CHART=oci://quay.io/cilium/charts/cilium
