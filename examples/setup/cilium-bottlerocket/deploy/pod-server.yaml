# The target of the pod-to-pod and ClusterIP Service checks: a small HTTP server on the system
# node. It listens on port 8080 inside the pod. Only the ClusterIP Service in service.yaml
# selects it, and nothing publishes the port outside the cluster. The root file system is
# read-only; the page that httpd serves goes to a small emptyDir at /tmp/www. Both probes ask
# httpd for that page on port 8080; the readiness probe gates the Ready condition that setup.sh
# waits for before test.sh sends requests.
apiVersion: v1
kind: Pod
metadata:
  name: cb-server
  namespace: cilium-bottlerocket-demo
  labels:
    app.kubernetes.io/part-of: cilium-bottlerocket-sample
    app.kubernetes.io/name: cb-server
spec:
  nodeSelector:
    eks.amazonaws.com/nodegroup: system
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: main
      image: public.ecr.aws/docker/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command:
        - sh
        - -c
        - mkdir -p /tmp/www && echo cb-server-ok > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 30
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: www
          mountPath: /tmp/www
  volumes:
    - name: www
      emptyDir:
        sizeLimit: 1Mi
