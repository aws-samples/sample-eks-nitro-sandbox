# Pinned build tools of the sandbox AMI. Each key appears exactly once.
# scripts/10-build-ami-packer.sh reads the Packer keys on the operator machine;
# scripts/builder/10-host-setup.sh reads the other keys on the builder.
#
# Packer and the Amazon plugin: the zip digest must equal the line in HashiCorp's
# SHA256SUMS file, and that file must have a good signature from the key with the primary
# fingerprint HASHICORP_KEY_FPR (HashiCorp's release key, published at HASHICORP_KEY_URL).
# One zip digest per operator platform (<os>_<arch>, as HashiCorp names the zips).
PACKER_VERSION=1.16.2
PACKER_ZIP_SHA256_LINUX_AMD64=abbfe0cf74985084112659b53e3565f264f70a20914c3b7c4f789f54f61c2414
