# The hello-world proof pod. It boots with no network at all
# (sandbox.amazonaws.com/network-isolated: "true"): it needs none, since every check reaches it
# through kubectl exec, and that lets the page show the no-network property honestly rather than
# imply a limit nothing enforces. It runs in its own Nitro Sandbox (a Firecracker microVM with
# its own guest kernel), so uname -r, the boot uptime and /sys/block all come from the guest,
# not the host node.
#
# nodeSelector targets whichever consumer brought up the node: the Karpenter NodePool label or
# the managed node group name. setup.sh renders @NODE_SELECTOR_KEY@/@NODE_SELECTOR_VALUE@ and the
# matching toleration for the path you run.
apiVersion: v1
kind: Pod
metadata:
  name: isolated-sandbox-hello
  namespace: al2023-ami-sample
  labels:
    app: isolated-sandbox-hello
  annotations:
    sandbox.amazonaws.com/network-isolated: "true"   # boot the VM with no network besides loopback
spec:
  runtimeClassName: isolated-sandbox
  nodeSelector:
    "@NODE_SELECTOR_KEY@": "@NODE_SELECTOR_VALUE@"
  tolerations:
    - key: sandbox.blueprint/al2023-ami
      operator: Equal
      value: "true"
      effect: NoSchedule
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: main
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["sh", "-ec"]
      args:
        - |
          echo "Guest kernel: $(uname -r)"
          echo "Guest boot uptime (s): $(awk '{print $1}' /proc/uptime)"
          echo "Guest block devices:"
          ls -1 /sys/block
          sleep infinity
      resources:
        requests:
          cpu: "200m"
          memory: 768Mi
