# The sandboxes' network on Claude Platform on AWS: the poller in, the
# Claude Platform on AWS endpoint out.
#
# It replaces ../egress-policy.yaml (same name) and differs in one rule: HTTPS goes
# to aws-external-anthropic.<AWS_REGION>.api.aws, where AnthropicAWS sends every
# request, instead of api.anthropic.com, which this path does not use.
#
# There is no rule for the Pod Identity credential address (169.254.170.23): in a
# Nitro sandbox it is served inside the VM itself, so it never reaches this policy.
#
# <COREDNS_IP> is your cluster's CoreDNS Service address:
#   kubectl get svc -n kube-system kube-dns -o jsonpath='{.spec.clusterIP}'
# <AWS_REGION> is your workspace's Region.
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: claude-sandbox-worker-egress
spec:
  podSelector:
    matchLabels:
      app: claude-sandbox-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: claude-poller
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - ipBlock: { cidr: <COREDNS_IP>/32 }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - domainNames:
            - aws-external-anthropic.<AWS_REGION>.api.aws
      ports:
        - { protocol: TCP, port: 443 }
