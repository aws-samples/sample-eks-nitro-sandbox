# app-sandboxed-detector: the sandboxed app pod again, with a runtime detector inside its
# sandbox. The app container is the same as in app-sandboxed. The detector is a sidecar
# that drives the guest kernel's audit subsystem and prints alerts to stdout, so the node's
# log agent ships them like any other container log.
#
# hostPID: true joins the sandbox's own PID namespace, the guest's, not the node's: it is how
# the detector can register as the guest's audit daemon. WITHOUT runtimeClassName:
# isolated-sandbox THE SAME FIELD JOINS THE NODE'S PID NAMESPACE, so never copy it into an
# ordinary pod. The detector holds one capability, for audit, and it reaches only this pod's
# guest.
apiVersion: v1
kind: Pod
metadata:
  name: app-sandboxed-detector
  namespace: runtime-detection   # the scripts change it when NAMESPACE is set
  labels:
    app: runtime-detection-app
  annotations:
    karpenter.sh/do-not-disrupt: "true"   # keep consolidation from evicting this bare pod mid-run
spec:
  runtimeClassName: isolated-sandbox
  hostPID: true
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    # A native sidecar: it starts, and is running, before the app container starts.
    - name: detector
      restartPolicy: Always
      image: public.ecr.aws/docker/library/python:3.12-slim
      imagePullPolicy: IfNotPresent
      command: ["python3", "-u", "/detector/guest-detector.py"]
      env:
        - name: HEARTBEAT_FILE   # touched with every heartbeat, for the probes below
          value: /run/detector/heartbeat
      # Both probes fail when the detector has not written a heartbeat (every 60 s) for
      # 180 s, so a stalled detector is restarted. The app container is not affected.
      readinessProbe:
        exec:
          command: ["python3", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/run/detector/heartbeat') > 180)"]
        initialDelaySeconds: 5
        periodSeconds: 30
      livenessProbe:
        exec:
          command: ["python3", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/run/detector/heartbeat') > 180)"]
        initialDelaySeconds: 30
        periodSeconds: 60
        failureThreshold: 3
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["AUDIT_CONTROL"]
      volumeMounts:
        - name: detector
          mountPath: /detector
          readOnly: true
        - name: detector-state
          mountPath: /run/detector
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
  containers:
    - name: app
      image: public.ecr.aws/docker/library/python:3.12-slim
      imagePullPolicy: IfNotPresent
      # The shell records its pid, then becomes `sleep`, so the probes can check that process.
      # A pod spec writes the shell's $$ as $$$$, because Kubernetes turns $$ into $.
      command: ["sh", "-c", "echo $$$$ > /tmp/app.pid && exec sleep infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      # Both probes check the app process is alive. Only that process dying fails them, so
      # neither can restart the app in the middle of a test.
      readinessProbe:
        exec:
          command: ["sh", "-c", "kill -0 \"$(cat /tmp/app.pid)\""]
        periodSeconds: 30
      livenessProbe:
        exec:
          command: ["sh", "-c", "kill -0 \"$(cat /tmp/app.pid)\""]
        periodSeconds: 30
        failureThreshold: 3
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 256Mi
  volumes:
    - name: detector
      configMap:
        name: guest-detector
    - name: detector-state
      emptyDir: {}
