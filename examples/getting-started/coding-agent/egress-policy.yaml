# Egress for the coding agent: DNS, Bedrock and GitHub, nothing else.
#
# An EKS Auto Mode ApplicationNetworkPolicy is a NetworkPolicy that also accepts
# hostnames (domainNames) in an egress rule. For the pods it selects, all ingress
# and all egress are denied except DNS to CoreDNS, the Pod Identity credential
# address, and HTTPS to the three names below.
#
# <COREDNS_IP> is your cluster's DNS address, the kubelet's clusterDNS, filled in by the
# README's step 5 command (or by hand, from one node; needs permission to get nodes/proxy):
#   kubectl get --raw "/api/v1/nodes/$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')/proxy/configz"
#   and take kubeletconfig.clusterDNS[0]
# On EKS Auto Mode CoreDNS runs on each instance rather than in cluster pods, so the
# kube-dns Service in kube-system carries this address but has no endpoints behind it.
# The address is the same from either source and fixed for the life of the cluster, so
# DNS egress is allowed with an ipBlock on it. The guide below derives it from the
# cluster's service CIDR instead of reading the kubelet: describe-cluster, then the .10
# address of serviceIpv4Cidr.
# https://docs.aws.amazon.com/eks/latest/userguide/auto-net-pol.html
# If you run in a Region other than us-west-2, change the Bedrock hostname to match.
#
# The Pod Identity rule is what lets the agent get its Bedrock credentials. A Nitro
# sandbox passes credential requests to 169.254.170.23 on to the Pod Identity Agent on
# the node, and this policy applies to them: without the rule they time out, from a
# sandboxed pod as from an ordinary one.
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: coding-agent-egress
spec:
  podSelector:
    matchLabels:
      app: coding-agent
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 }   # EKS Pod Identity credentials
      ports:
        - { protocol: TCP, port: 80 }
    - to:
        - domainNames:
            - bedrock-runtime.us-west-2.amazonaws.com   # the model
            - github.com                                # git clone and push
            - api.github.com                            # read the issue, open the PR
      ports:
        - { protocol: TCP, port: 443 }
