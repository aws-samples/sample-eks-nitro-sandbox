apiVersion: v1
kind: Pod
metadata:
  name: hello-network-isolated
  annotations:
    sandbox.amazonaws.com/network-isolated: "true"   # <-- boot the VM with no network besides loopback
spec:
  runtimeClassName: isolated-sandbox
  containers:
    - name: hello
      image: public.ecr.aws/docker/library/alpine:3.20
      command: ["sh", "-c"]
      args:
        - |
          echo "kernel:  $(uname -r)"
          echo "ipv4:    $(ip -o -4 addr show | awk '{print $2 "=" $4}' | tr '\n' ' ')"
          echo "route:   $(ip route | head -n 1 | grep . || echo none)"
          sleep infinity
      resources:
        requests: { cpu: "1", memory: 768Mi }
        limits:   { cpu: "1", memory: 768Mi }
