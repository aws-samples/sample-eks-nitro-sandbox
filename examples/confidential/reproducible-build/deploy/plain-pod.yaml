apiVersion: v1
kind: Pod
metadata:
  name: reproducible-build-plain
  # setup.sh fills in the namespace, the image digest and the node at apply time.
  labels:
    app.kubernetes.io/name: reproducible-build-plain
    app.kubernetes.io/managed-by: reproducible-build
    # Deliberately not app.kubernetes.io/name: reproducible-build. The Service selects
    # that label, and this pod must not receive traffic: it is the control that shows the
    # same machine readings without a confidential-sandbox guest, so the comparison is
    # about where the container ran, not what it ran.
spec:
  # No runtimeClassName: an ordinary pod. It runs the SAME image as the sandboxed pod.
  # setup.sh pins it to the node the sandboxed pod landed on, so the two readings come
  # from one machine.
  nodeName: <NODE_NAME>
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: main
      image: <IMAGE_REPO>@<IMAGE_DIGEST>
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
