# Helm values for the openshell-workspace chart, installed in the sandbox namespace.
#
# This chart owns only the namespace-scoped sandbox prerequisites: the sandbox
# ServiceAccount, its Role and RoleBinding, and a NetworkPolicy restricting sandbox SSH
# to the gateway's own pods. It creates no namespace and no gateway.
#
# scripts/setup.sh substitutes <GATEWAY_RELEASE> and <GATEWAY_NAMESPACE>.
gateway:
  # Matches server.drivers.kubernetes.allowDriverConfig on the gateway (left at its
  # default, false): this sample's sandbox policy and template name everything the
  # workload needs, so no caller-selected PVC mount is admitted.
  allowDriverConfig: false
  serviceAccount:
    name: <GATEWAY_RELEASE>
    namespace: <GATEWAY_NAMESPACE>
  networkPolicy:
    podSelector:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: <GATEWAY_RELEASE>

sandboxServiceAccount:
  create: true
  name: openshell-sandbox

networkPolicy:
  enabled: true
